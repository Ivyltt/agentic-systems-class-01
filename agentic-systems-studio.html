/* The framework's own worked examples, quoted so students can go and run them. */
function wShapes(host, done){
  const svg = (s,i,vb) => '<svg class="sh-svg" viewBox="0 0 240 ' + (vb||116) + '" role="img" aria-hidden="true">' +
    '<defs><marker id="shar' + i + '" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
    '<path d="M0 0 L8 4 L0 8 z" fill="var(--ink-3)"/></marker></defs>' + s + '</svg>';
  host.innerHTML = '<div class="stage">' +
    '<div class="stage-bar"><span class="stage-title">Four shapes &middot; who decides the order</span></div>' +
    '<div class="stage-body">' +
      '<div class="sh-grid">' + SHAPES.map(function(s,i){
        return '<div class="sh-card' + (i===3?" on":"") + '">' +
          '<p class="sh-nm">' + s.nm + '</p>' + svg(s.svg, i, s.vb) +
          '<div class="sh-who"><b class="' + s.cls + '">' + s.who + '</b>' + s.tail + '</div>' +
          '<div class="sh-ex"><span class="l">seen in</span><span>' + s.prod + '</span></div></div>';
      }).join("") + '</div>' +
      '<div class="sh-note">The same agents, the same amount of work, wired four ways, with the prompt tokens counted from the strings each design would really send: ' +
      '<b>round-robin costs 14× the cheapest shape.</b> Everyone speaks every round, and every one of them re-reads the whole transcript to do it. ' +
      'Note what that number depends on: <b>four</b> agents and three rounds. With two agents and a stopping condition — the poem below — round-robin is the cheapest thing there is. ' +
      'The cost is not in the shape; it is in how many agents the shape makes speak. ' +
      '<span style="color:var(--ink-3)">Real strings, at roughly four characters per token.</span></div>' +
    '</div></div>';
  Array.from(host.querySelectorAll(".sh-svg")).forEach(function(sv,i){
    sv.querySelectorAll(".ar path").forEach(function(pa){ pa.setAttribute("marker-end","url(#shar"+i+")"); });
    sv.querySelectorAll(".ar.d path").forEach(function(pa){ pa.setAttribute("marker-start","url(#shar"+i+")"); });
  });
  /* static reference cards: they do not count as "explored" — the run below does */
}

function wRouting(host, done){
  const EX = ROUTING.examples;
  let ei = 0, ri = 0, si = 0;

  function codeBlock(text, hot){
    return text.split("\n").map(function(ln, k){
      const n = k + 1;
      return '<span class="cl' + (hot === n ? " live" : "") + '"><span class="ln">' + n + '</span>' +
             hiLine(ln, "py") + '</span>';
    }).join("");
  }

  function paint(){
    const ex = EX[ei], run = ex.runs[ri], steps = run.steps, step = steps[si];
    Array.from(host.querySelectorAll("#rtTabs .chip")).forEach(function(c,j){
      c.className = "chip " + (j===ei ? "picked" : "");
    });

    host.querySelector("#rtTask").innerHTML =
      '<div class="rt-task"><b>THE TASK &nbsp;&middot;&nbsp; ' + esc(ex.api) + '</b>' +
      (ex.url ? '<a class="ag-link" style="float:right;margin:0" href="' + ex.url + '" target="_blank" rel="noopener">AutoGen docs &rarr;</a>' : '') +
      '<br>' + esc(ex.task) + '</div>' +
      '<div class="rt-roster">' + ex.agents.map(function(a){
        return '<div class="rt-ag"><span class="n">' + esc(a.name) + '</span><span class="d">' + esc(a.description) + '</span></div>';
      }).join("") + '</div>' +
      (ex.runs.length > 1 ? '<div class="chips" id="rtRuns" style="margin-bottom:13px">' + ex.runs.map(function(r,j){
        return '<button class="chip' + (j===ri?" picked":"") + '" data-r="' + j + '">' + esc(r.label) + '</button>';
      }).join("") + '</div>' : "");
    Array.from(host.querySelectorAll("#rtRuns .chip")).forEach(function(c){
      c.style.cursor = "pointer";
      c.onclick = function(){ ri = +c.dataset.r; si = 0; paint(); if(done) done(); };
    });

    host.querySelector("#rtCounts").innerHTML =
      '<div class="rt-c"><span class="k">agent turns</span><span class="v">' + step.agentTurns +
        '</span><span class="t">of ' + run.agentTurns + '</span></div>' +
      '<div class="rt-c' + (step.decidedBy==="model" ? " hot" : "") + '"><span class="k">routing calls</span><span class="v">' + step.routingCalls +
        '</span><span class="t">of ' + run.routingCalls + '</span></div>' +
      '<div class="rt-c"><span class="k">model calls, total</span><span class="v">' + step.modelCalls +
        '</span><span class="t">of ' + run.modelCalls + '</span></div>';

    const showSel = !!ex.selectorCode && run.usesRules;
    const left = showSel
      ? '<div><div class="lr-box"><div class="lr-bh"><span>what decided this step</span><span>selector_func</span></div>' +
        '<pre class="code">' + codeBlock(ex.selectorCode, step.line) + '</pre></div>' +
        '<div class="lr-box" style="margin-top:10px"><div class="lr-bh"><span>how the team is built</span><span>' + esc(ex.api) + '</span></div>' +
        '<pre class="code">' + codeBlock(ex.code, 0) + '</pre></div></div>'
      : '<div class="lr-box"><div class="lr-bh"><span>how the team is built</span><span>' + esc(ex.api) + '</span></div>' +
        '<pre class="code">' + codeBlock(ex.code, 0) + '</pre>' +
        '<div class="rt-note">' +
          (ex.id === "poem"
            ? 'Nothing in this code chooses a speaker. <b>RoundRobinGroupChat</b> simply goes round the list, so a model is never asked who is next — the only decision left is when to stop.'
            : 'Notice what is <b>missing</b>: no <code>selector_func</code>. Nothing narrows the choice, so a model is asked who speaks next after every single message.') +
        '</div></div>';

    const msgs = steps.slice(0, si+1).map(function(s,k){
      const body = s.content.length > 190 ? s.content.slice(0,187) + "…" : s.content;
      return '<div class="rt-msg' + (k===si ? " now" : "") + (s.kind==="result" ? " res" : "") + '">' +
             '<div class="s">' + esc(s.speaker) + (s.kind==="tool" ? " · tool call" : s.kind==="result" ? " · tool result" : "") + '</div>' +
             '<div class="b">' + esc(body) + '</div></div>';
    }).join("") + (si < steps.length-1 ? '<div class="rt-pend">… ' + (steps.length-1-si) + ' more to come</div>' : "");

    const last = si === steps.length - 1;
    const tag = (run.failed && last) ? "The limit stopped it. No answer was ever produced."
      : {rule:"A rule decided this. No model call.",
         model:"A model was asked. This costs one call.",
         rotation:"Nothing decided this step.",
         "same turn":"Ordinary Python ran."}[step.decidedBy] || "";
    host.querySelector("#rtBody").innerHTML =
      '<div class="lr-two rt-two">' + left +
        '<div class="lr-box"><div class="lr-bh"><span>the conversation</span>' +
          '<div class="lr-step"><button class="btn tiny" id="rtPrev">&#9664;</button>' +
          '<b>step ' + (si+1) + ' / ' + steps.length + '</b>' +
          '<button class="btn tiny" id="rtNext">&#9654;</button></div></div>' +
          '<div style="padding:10px 12px">' + msgs + '</div></div>' +
      '</div>' +
      '<div class="rt-why ' + ((run.failed && last) ? "model" : step.decidedBy === "model" ? "model" : "rule") + '"><b>' + tag + '</b> ' + esc(step.why) + '</div>';
    host.querySelector("#rtPrev").onclick = function(){ if(si>0){ si--; paint(); } };
    host.querySelector("#rtNext").onclick = function(){ if(si<EX[ei].runs[ri].steps.length-1){ si++; paint(); if(done) done(); } };
  }

  host.innerHTML = '<div class="stage">' +
    '<div class="stage-bar"><span class="stage-title">Two examples from AutoGen&rsquo;s own documentation, running</span></div>' +
    '<div class="stage-body">' +
      '<div class="demo-prov" style="margin:0 0 12px">&#9654; REAL RUN <b>Captured from an actual execution of real AutoGen.</b> ' +
      'Python ' + esc(DEMOS.python) + ((DEMOS.versions||{})["autogen-agentchat"] ? ' &middot; autogen-agentchat ' + esc(DEMOS.versions["autogen-agentchat"]) : '') +
      ' &middot; exit code 0 &middot; no API key, no network. The teams, the terminations and the tool calls are real — the search tool really runs and the percentage really is computed. Only the model is a fixed script.</div>' +
      '<div class="chips" id="rtTabs"></div>' +
      '<div id="rtTask"></div>' +
      '<div class="rt-counts" id="rtCounts"></div>' +
      '<div id="rtBody"></div>' +
    '</div></div>';
  const tabs = host.querySelector("#rtTabs");
  EX.forEach(function(ex,j){
    const b = el("button","chip"); b.textContent = ex.api + " · " + ex.shape; b.style.cursor = "pointer";
    b.onclick = function(){ ei = j; ri = 0; si = 0; paint(); if(done) done(); };
    tabs.appendChild(b);
  });
  paint();
}

</script>

<script>
const NODES_P1 = [
{
  id:"agency", part:P1, num:"00", title:"Agency, in five rungs", tag:"mixed", tagText:"orientation",
  lede:"There is no single thing called “an agent”. There are several common setups, and they differ in one way: how many decisions you have handed to the model. This page runs five of them on the same question, so you can see the difference instead of arguing about the word.",
  brief:`<p>If you ask ten people what an <em>agent</em> is, you get ten answers. That is not worth arguing about. A better question, and one that always has an answer: <strong>which decisions does the model make, and which does your code make?</strong></p>
    <p>Sort systems by that question and they line up in five steps. At the bottom you decide everything and the model only writes text. One step up, the model can ask for a tool, but your code decides the turn is over. Higher up, the model decides how many times to use its tools, and when it is finished — which is the first point where a program can keep going forever. Higher again, it writes a plan for itself; higher still, several models split the work.</p>
    <p>No step is better than the others. Each one lets you do something the step below cannot, and charges you for it in three ways: more calls to the model, more code for you to write and maintain, and new things that can go wrong. The skill is picking the lowest step that actually solves your problem.</p>
    <h5>What the model can and cannot do</h5>
    <p>One thing to be clear about before you read the runs below, because it is the most common misunderstanding in this field. <strong>The model never runs anything.</strong> When you see <code>ACTION: get_weather(Boston)</code>, the model has written a piece of text that names a function. That is all it did. A piece of code then reads that text, decides whether to honour it, and calls the real function &mdash; code you wrote, or a framework&rsquo;s or a provider&rsquo;s runtime doing it on your behalf. It is never the model. Even a hosted tool that looks like &ldquo;the model ran it&rdquo; is a program wrapped around the model, executing for it and feeding the result back in.</p>
    <p>That is why every prompt in the runs below starts with a line like <code>Tools you may call: get_weather(city), get_forecast(city)</code>. That line is the complete list of what the model is allowed to ask for, and you wrote it. Checking inputs, logging, rate limits, refusing dangerous operations — all of that lives on your side, in ordinary code you can test. The safest capability is the one you never put on that line.</p>
    <h5>Who decides when to stop</h5>
    <p>From the third step up, the model decides when the job is finished. So if the job <em>cannot</em> be finished, nothing stops it — it will keep calling tools until your provider refuses the next request. You pay for every step and the user gets nothing.</p>
    <p>The fix is that you write the stopping rule yourself. In practice that means four checks, and they stack:</p>
    <ul>
      <li><strong>A step limit.</strong> Never run more than N rounds. Crude, but never skip it.</li>
      <li><strong>A repeat check.</strong> If it asks for something it has already asked for, it is not making progress — stop. This catches a stuck loop much earlier than a step limit does.</li>
      <li><strong>A budget.</strong> Stop after N tokens, or N cents. This is the one your finance team understands.</li>
      <li><strong>A forced answer.</strong> Whenever you stop for any reason, make one more call that turns whatever was found into a sentence for the user.</li>
    </ul>
    <p>The fourth one is the one people leave out, and it is the one that matters most to whoever is waiting. Stopping a runaway loop saves your money. Forcing a final answer saves your user. “Nothing under $90 exists on this route; the cheapest nonstop is $179” is a good outcome. Silence is not.</p>
    <h5>How this course is built</h5>
    <p>Part I is this page: the five steps, and what each one costs. Part II asks what changes when there is more than one model working — who talks next, and who checks the work. Part III opens a real application, FlightFinder Pro, built on AutoGen, and finds every idea from Parts I and II already sitting in it.</p>`,
  key:"When you look at any system, ask one thing: which decisions does the model make, and which does your code make? Cost, testing and most of what can go wrong all follow from that answer.",
  figure:figCourseMap, figureHint:"three parts, in order", figCap:"The three parts, in order. From here on, every diagram uses one colour code: amber for a decision a model makes, steel blue for one your code makes.",
  widgets:[{fn:wAutonomy},
    {intro:`<h5>The same question, five times</h5>
      <p>The ladder above is a diagram. This is the same thing running. One question that asks for <strong>two</strong> things — should I bring a coat, and should I leave early — put through five different programs. The only thing that changes between them is the code around the model, which is why the differences below are caused rather than claimed.</p>
      <p>One thing to know before you read the numbers: <b>the model in these five runs is not a language model.</b> It is a small local function that reads the prompt it is given and answers by rule — left to itself it uses only the tools that serve whichever question came first and then stops; handed a plan, it follows the plan to the end; told it is a critic, it checks whether the airport question was answered at all. No key, no network, and the same answer every time. That is deliberate: it lets the counts below — calls, tokens, lines of code — come from the harness alone, with nothing hidden inside a model&rsquo;s mood. Everything the counts describe is real code that ran.</p>
      <p>Read the row called <code>both questions answered</code> first: <b>NO, NO, NO, YES, YES</b>. The place where it flips is the whole argument for the ladder. Then click each step and read the middle panel — the prompt is what changes, and the answer follows it.</p>
      <p>One more number to watch, in the header of that middle panel: <b>≈N tok</b>. Step through L2 and you will see it grow, because every call re-sends the entire conversation so far. The model remembers nothing between calls; the transcript <em>is</em> its memory, and you pay for all of it again every single round.</p>`, fn:wLadder},
  ], mechHint:"pick a step, click through its calls, then compare all five",
  claim:"I can place any system on the autonomy ladder by asking which decisions the model makes, say what each step buys and what it costs, and explain why the tool list and the stopping rule are both mine to write.",
},
];
</script>

<script>
const NODES_P2 = [
{
  id:"routing", part:P2, num:"01", title:"Routing: who speaks next", tag:"mixed", tagText:"who talks next",
  lede:"Splitting a job across several models is a real decision with real reasons — and it creates a problem you did not have before: after every message, something has to pick who talks next. Get that wrong and two agents hand work back and forth until a limit stops them.",
  brief:`<h5>First: why use more than one model at all?</h5>
    <p>Adding agents is not automatically better. It multiplies your calls, your code and your ways of going wrong, so it needs a reason. There are four good ones.</p>
    <ul>
      <li><strong>Two jobs that pull against each other.</strong> A writer is trying to be helpful. A checker is trying to find fault. Put both instructions in one prompt and you get a compromise: a mild answer that also mildly criticises itself. Split them and each one can do its job properly. You saw this in L4 on the last page — the checker sent the draft back because it was not looking for reasons to be satisfied.</li>
      <li><strong>Different things should be visible to different agents.</strong> A checker that is shown the writer's reasoning is being asked to judge that reasoning. Show it only the finished answer and it has to judge the answer. What an agent can see decides what it can be fooled by.</li>
      <li><strong>Different tools for different roles.</strong> One agent gets the search tools; another gets the ones that spend money. Neither can do the other's job, and that is enforced by the tool list you hand each of them, not by asking nicely in a prompt.</li>
      <li><strong>Independent work that can run at the same time.</strong> Two searches with nothing to say to each other can run together and halve the waiting.</li>
    </ul>
    <p>And one bad reason, which is common: splitting a job into steps that were never really separate. If the pieces need to see each other's work to make sense, you have not divided the task — you have added handovers.</p>
    <h5>Then: something has to pick who talks next</h5>
    <p>The <strong>dispatcher</strong> is the piece of the program that picks the next speaker. It runs after every message and asks the same question: given what has happened so far, whose turn is it? There are three ways to answer that.</p>
    <p><strong>1 · Let the model choose.</strong> Show it the whole conversation and ask who should go next. This works. What it costs is easy to miss: a model call before every single turn, whether or not there was anything to decide — and those calls produce no message, so they never appear in the transcript. Only the bill shows them. The second example below counts them.</p>
    <p><strong>2 · Write fixed rules.</strong> “After the writer, always the critic.” This costs nothing, gives the same answer every time, and you can unit-test it. It also cannot tell when a step is pointless: it will call the critic even on a question with nothing to check, and you pay for that call every time.</p>
    <p><strong>3 · Rules first, model only where the rules run out.</strong> Two functions and a prompt, checked in this order:</p>
    <ul>
      <li><code>candidate_func</code> — who is even <em>allowed</em> to speak next. AutoGen already keeps the previous speaker off the ballot by default; this is where you narrow it further. With three agents that is a small thing. With ten it is the difference between the model choosing from two names and choosing from nine.</li>
      <li><code>selector_func</code> — can a rule answer outright? If it returns a name, that is the answer and no model call happens at all. If it returns <code>None</code>, the question moves on.</li>
      <li>the <strong>selector prompt</strong> — only now is a model asked, and it gets a much smaller question than “who should go next”: two names, and a written rule for choosing between them.</li>
    </ul>
    <p>The model is not being made less intelligent here. It is being asked a smaller, better-defined question — one decision, two options, a stated rule — and your code checks the answer before acting on it.</p>
    <p>The worked example further down uses only the last two of these three: with three agents and AutoGen's default guard against a repeated speaker, there is nothing left for <code>candidate_func</code> to narrow. FlightFinder, on the next page, switches that default off and uses <code>candidate_func</code> to do the narrowing itself — which is the normal arrangement once you have written rules of your own.</p>`,
  key:"Use more than one model when two jobs pull against each other, or need to see different things. Then let your code decide who speaks next wherever it can, and ask the model only the one question your rules cannot answer.",
  breaks:"The classic multi-agent failure is two agents politely handing work back and forth — “could you check this?” “looks good, could you confirm?” — until a message limit stops them. You pay for every round and the user gets no answer. The second tab of the first example below is exactly that, in real AutoGen.",
  figure:figRoutingStack, figureHint:"three checks, strictest first", figCap:"The third check costs money every time it runs. The first two are free and give the same answer every time, so let them decide as much as they can.",
  widgets:[{intro:`<h5>Four ways to wire a team, and who decides the order</h5>
      <p>Once you have decided to use several agents, <em>how you wire them together</em> is a second choice, and it usually gets made without much thought. There are only a handful of standard shapes, and the useful way to tell them apart is one question: <strong>who decides the order?</strong> Read the four below with that question in hand. Three of them answer it once, when you write the program. Only the last one answers it again on every single turn — which is what the rest of this page is about.</p>`, fn:wShapes},
    {intro:`<h5>Two of AutoGen's own examples, running</h5>
      <p><b>Why these two.</b> The four cards above are shapes on paper. These are two of those shapes actually running, and both come straight out of AutoGen's documentation, so you can go and run them yourself. The first is a round-robin; the second is a dispatcher. Watch what changes and what does not.</p>
      <p><b>The poem.</b> One agent writes, one agent criticises, and they alternate until the critic types <code>APPROVE</code>. Step through it and watch the middle counter: it never moves. <b>Zero routing calls</b>, because nothing ever chooses. The rotation <em>is</em> the rule, and the only decision left anywhere in the design is when to stop.</p>
      <p><b>Then switch to the second tab</b> — the same two agents, the same task, and a critic that is simply never satisfied. It is not broken: it was told to give feedback until it was happy, and it never gets happy. The run ends because it hits a message limit, and <b>the last line of the transcript is the critic complaining</b>. Eight turns paid for, and nobody ever handed the user a poem. This is the failure the red box above describes, and it is why the stopping rule has to be yours to write — and why it has to end with an answer rather than just an ending.</p>
      <p><b>The basketball question.</b> “Who scored most for the Miami Heat in 2006-07, and how much did his rebounds change between two later seasons?” You cannot answer that in a fixed order: you have to find out <em>who the player is</em> before you can look up his rebounds. So something has to choose the next speaker after every message — which is what a dispatcher is for. Step through it and watch the tool calls: <code>search_web_tool</code> and <code>percentage_change_tool</code> are real Python and really run. The 85.98% at the end was computed, not written by a model.</p>
      <p><b>Now switch to the second tab.</b> Same question, same three agents, plus four lines of Python — AutoGen's own <code>selector_func</code>, which says: <em>if the last speaker was not the planner, go back to the planner.</em> Watch the counters. Agent turns: <b>9 either way</b>. Routing calls: <b>9, then 4</b>. More than half of the “who speaks next” questions turn out to have an obvious answer, and once that answer is written down, no model has to be asked for it.</p>
      <p>That is the routing stack from the figure above, on a real example: <b>let code answer what it can, and ask the model only the question that is still open</b> — here, which specialist the next subtask needs, which only the planner's own message can tell you.</p>
      `, fn:wRouting}], mechHint:"read the four shapes, then step through both AutoGen examples and watch what decides each turn",
  claim:"I can give a concrete reason for using more than one model, name the four ways a team can be wired, and say for any step in a run whether a rule or a model decided it.",
},
];
</script>

      }).join("") + '</table>';
  }

  function teamTab(c){
    const a = c.rows[0], b = c.rows[1];
    const row = function(label, ka, kb, fmt){
      const va = fmt ? fmt(a[ka]) : a[ka], vb = fmt ? fmt(b[ka]) : b[ka];
      const diff = String(va) !== String(vb);
      const wrap = function(v){ return diff ? '<span class="cm-hi">' + v + '</span>'

      return '<tr><td class="k">' + label + '</td><td class="n">' + wrap(va) +

          (same ? '<span class="cm-same">' : '<span style="color:var(--model)">') +

      row("agent turns", "turns") +
      row("routing calls (a model chose the speaker)", "routing") +
      row("model calls, total", "calls") +
      row("tokens", "tokens", null, function(v){ return v.toLocaleString(); }) +
      row("within_budget in the report", "within", null, function(v){ return String(v); }) +
      row("options returned", "opts") +

        'number below is the same on any machine.</div>' +
      '<div id="cmList"></div>' +
    '</div></div>';

  const list = host.querySelector("#cmList");
  D.cmp.forEach(function(c, i){
    const it = el("div", "cm-item");

      '<div class="cm-hd"><span class="cm-id">' + c.id + '</span>' +

        (c.kind === "guard" ? guardTab(c) : teamTab(c)) +
        '<div class="cm-why">' + c.why + '</div></div>';

    it.querySelector(".cm-hd").onclick = function(){

}

  id:"ff-map", part:P3, num:"02", pipeline:true, stageHi:["req","parse","plan","fetch","ext","rank","crit","summ"], pipeNote:"Every stage on this diagram appears in the runs below, and in the runnable copy at the bottom. Stage two is one to three sessions, and code picks how many.", title:"FlightFinder Pro", tag:"mixed", tagText:"the case",
  lede:"A real AutoGen application: one English sentence in, a validated report out. Every part that decides anything is a part you already have a name for — and the program asks a model how to proceed at exactly two points: what dates the wording allows, and whether the ranked results need a second look.",
  brief:`<p>The system takes one English sentence — &ldquo;find flights from SFO to JFK in early November, within $200&rdquo; — and returns a validated <code>FlightSearchReport</code>. In between: a parser agent, a date plan made by code, one to three concurrent browser sessions against Kayak, an extractor agent per date, a three-agent team with a dispatcher, and a token report.</p>
    <h5>Two points where a model is asked how to proceed</h5>
    <p>The source prints them as <code>dynamic decision 1</code> and <code>dynamic decision 2</code>. First: <strong>what dates does the user&rsquo;s wording allow?</strong> — the parser&rsquo;s <code>date_is_flexible</code> and, when it is true, a window: <code>date_window_start</code> to <code>date_window_end</code>. &ldquo;Early November&rdquo; becomes the 1st to the 7th. That is the model interpreting language, and it is the last thing the model decides about dates. Second: <strong>once the candidates are ranked, do they need a second look?</strong> — the dispatcher&rsquo;s choice between the critic and the summary. One more model output steers the run, the critic&rsquo;s verdict, but no model acts on it: a rule reads its first word — <code>APPROVED</code>, <code>RETRY</code> or <code>NO_DATA</code> — and a cap of one retry decides how long that can go on. Everything else downstream — how many searches actually run, which dates, whether any of them has already passed, when the run ends — is deterministic code. The system is not adaptive because a model decides everything; it is adaptive because a few small judgements are wired into machinery that can act on them, guard them, test them and price them.</p>
    <p>The clearest evidence is what is <em>missing</em>. Search the whole codebase for <code>tools=</code> and you find nothing: no agent is handed a tool, so no model ever decides <em>whether</em> to search. Ordinary Python does the fetching and hands the text to an agent. That removes a decision, a failure mode, and a guard you would otherwise have to write.</p>
    <h5>The model gets an opinion; code keeps the veto</h5>
    <p>A seven-day window could mean seven browser sessions, and a browser session is the most expensive thing this program does. So the window goes into <code>plan_search_dates()</code>, and code decides what to do with it: keep at most <b>three</b> dates — the first, the last and the preferred one; drop any date that has already passed; and if the window is malformed or the model handed back something that is not a date at all, fall back to one search rather than build a fan-out on it. The model said what the user would accept. Code decided what the company will pay for. In the runnable panel at the bottom, the first preset fans out to three; the last preset hands code a window that is mostly behind us and watch it collapse to one.</p>
    <p>The way back is the mirror image. Each page is read by its <em>own</em> extractor agent, told which date it is looking at, and the results are merged into one block with a label per date — <code>[Strategy A: 2026-11-01, date-window sample]</code>, <code>[Strategy B: 2026-11-05, preferred date]</code>. The labels are not decoration: they are what makes it impossible for a fare from the 1st to be reported as an option on the 5th, and they survive into <code>source_strategy</code> and <code>departure_date</code> in the final report.</p>
    <h5>Three panels, three kinds of evidence</h5>
    <p><strong>Change one thing, measure what moved.</strong> Four comparisons, each changing exactly one input and holding everything else still — which is what makes the difference attributable. They were produced by running the application&rsquo;s real team offline: AutoGen&rsquo;s <code>SelectorGroupChat</code>, this project&rsquo;s <code>selector_func</code>, <code>candidate_func</code>, retry cap, termination and Pydantic validation all executed; only the model&rsquo;s replies were scripted, so the numbers are the same on any machine. The one to look at hardest is the last: two runs whose path and routing are identical, where the only thing that changed is whether the report tells the truth about having found nothing.</p>
    <p><strong>The same program, against real Kayak and a real model.</strong> Runs of <code>main_advanced.py</code> with nothing stubbed — pages fetched through a real browser session, <code>gpt-4o-mini</code> answering every prompt, stdout kept verbatim. Two are opened up: &ldquo;early November&rdquo; becoming a seven-day window, sampled by code to three real Kayak pages; and a window that started yesterday, clipped by code before a browser session was spent on it.</p>
    <p><strong>A runnable copy.</strong> The application&rsquo;s logic — the date plan, the routing, the trimming, the retry cap, the termination, the schema check and the exit guard — ported line for line into JavaScript so you can change an input and watch the path change, with a deterministic stand-in for each model call and synthetic flight data. The port is diffed against the Python on twenty thousand inputs and they agree on all of them. It is for seeing the mechanism move, not for measuring anything: the numbers that matter are in the two panels above it.</p>
    <p>Eight files in total, all in the repository&rsquo;s <code>flightfinder/</code> folder: <code>tools.py</code>, <code>schemas.py</code>, <code>fanout.py</code>, <code>agents_advanced.py</code>, <code>main_advanced.py</code>, a local web front end <code>web_app.py</code> that calls the same pipeline, and two test suites — <code>test_offline.py</code> and <code>test_integration.py</code>. Its <code>examples/</code> folder holds the scripts that produced the two evidence panels above (<code>run_comparisons.py</code>, <code>capture_live_runs.py</code>) and the two that check this page&rsquo;s port against the Python (<code>verify_port_python.py</code>, <code>verify_port_diff.py</code>).</p>`,
