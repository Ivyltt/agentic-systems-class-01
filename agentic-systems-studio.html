<title>Agentic Systems Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================================================
   TOKENS
     --model (amber) = a language model decides
     --code  (steel) = deterministic code decides
   ============================================================ */
:root {
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --surface-3:#E7ECF1;
  --line:#D2DAE3; --line-soft:#E3E9EF;
  --ink:#121A22; --ink-2:#47545F; --ink-3:#78858F;
  --model:#A96C05; --model-b:#E29A28; --model-bg:#FBF0DC;
  --code:#13687F;  --code-b:#2E93B0;  --code-bg:#E0F0F5;
  --pass:#2C7A50;  --pass-bg:#DFF0E5;
  --warn:#AE4227;  --warn-bg:#FAE4DE;
  --shadow:0 1px 2px rgba(18,26,34,.06), 0 8px 24px -14px rgba(18,26,34,.28);
  --radius:10px;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --disp:"Bricolage Grotesque","IBM Plex Sans", ui-sans-serif, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0C1218; --surface:#121B23; --surface-2:#17222B; --surface-3:#1E2C36;
  --line:#26343F; --line-soft:#1D2932;
  --ink:#E6EDF3; --ink-2:#A4B2BE; --ink-3:#74838E;
  --model:#E9AC44; --model-b:#C98B1E; --model-bg:#2A2113;
  --code:#5CBAD5;  --code-b:#2E8DA8;  --code-bg:#10262E;
  --pass:#6DC291;  --pass-bg:#12291D;
  --warn:#E9866C;  --warn-bg:#2C1712;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.8);
} }
:root[data-theme="dark"] {
  --bg:#0C1218; --surface:#121B23; --surface-2:#17222B; --surface-3:#1E2C36;
  --line:#26343F; --line-soft:#1D2932;
  --ink:#E6EDF3; --ink-2:#A4B2BE; --ink-3:#74838E;
  --model:#E9AC44; --model-b:#C98B1E; --model-bg:#2A2113;
  --code:#5CBAD5;  --code-b:#2E8DA8;  --code-bg:#10262E;
  --pass:#6DC291;  --pass-bg:#12291D;
  --warn:#E9866C;  --warn-bg:#2C1712;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.8);
}

* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased; }
h1,h2,h3,h4,h5 { font-family:var(--disp); font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.015em; }
p { margin:0; }
a { color:var(--code); }
code,pre,.mono { font-family:var(--mono); font-variant-ligatures:none; }
:focus-visible { outline:2px solid var(--code-b); outline-offset:2px; border-radius:4px; }
svg text { font-family:var(--mono); }

/* ---------- frame ---------- */
.app { display:grid; grid-template-columns:282px minmax(0,1fr); min-height:100vh; }
.rail { background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand { padding:20px 18px 14px; border-bottom:1px solid var(--line-soft); }
.brand h1 { font-size:19px; line-height:1.15; }
.brand .sub { font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.13em; color:var(--ink-3); margin-top:7px; }
.progress-wrap { padding:12px 18px 14px; border-bottom:1px solid var(--line-soft); display:flex; flex-direction:column; gap:7px; }
.progress-meta { display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.progress-track { height:5px; background:var(--surface-3); border-radius:99px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--code-b),var(--model-b)); width:0%; transition:width .5s cubic-bezier(.4,0,.2,1); }
.rail-list { list-style:none; margin:0; padding:8px; display:flex; flex-direction:column; gap:1px; flex:1; }
.rail-part { font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); padding:14px 10px 6px; display:flex; align-items:center; gap:8px; }
.rail-part::after { content:""; height:1px; background:var(--line-soft); flex:1; }
.rail-item { display:grid; grid-template-columns:24px 1fr 14px; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:0; cursor:pointer; padding:7px 10px; border-radius:7px; color:var(--ink-2); font-family:var(--sans); font-size:13.2px; line-height:1.32; }
.rail-item:hover { background:var(--surface-2); color:var(--ink); }
.rail-item[aria-current="true"] { background:var(--surface-3); color:var(--ink); font-weight:500; }
.rail-num { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.rail-item[aria-current="true"] .rail-num { color:var(--model); }
.rail-dot { width:7px; height:7px; border-radius:50%; border:1.5px solid var(--line); justify-self:end; }
.rail-item.done .rail-dot { background:var(--pass); border-color:var(--pass); }
.rail-foot { padding:10px 12px 16px; display:flex; flex-direction:column; gap:7px; border-top:1px solid var(--line-soft); position:sticky; bottom:0; background:var(--surface); }

.btn { font-family:var(--sans); font-size:12.8px; font-weight:500; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); padding:7px 11px; border-radius:7px; cursor:pointer; transition:.15s; }
.btn:hover { background:var(--surface-3); color:var(--ink); }
.btn.primary { background:var(--ink); color:var(--surface); border-color:var(--ink); }
.btn.primary:hover { opacity:.88; }
.btn.primary[disabled] { opacity:.4; cursor:not-allowed; }
.btn.tiny { font-size:11.5px; padding:5px 9px; }
.btn.on { background:var(--model-bg); border-color:var(--model-b); color:var(--model); }

/* ---------- main ---------- */
.main { min-width:0; padding:0 0 90px; }
.node { max-width:900px; margin:0 auto; padding:40px 32px 0; display:flex; flex-direction:column; gap:32px; }
.node-head { display:flex; flex-direction:column; gap:11px; }
.eyebrow { display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); flex-wrap:wrap; }
.eyebrow .tag { padding:2px 7px; border-radius:4px; letter-spacing:.08em; }
.tag.model { background:var(--model-bg); color:var(--model); }
.tag.code { background:var(--code-bg); color:var(--code); }
.tag.mixed { background:var(--surface-3); color:var(--ink-2); }
.node-head h2 { font-size:33px; line-height:1.08; }
.node-head .lede { font-size:16.5px; color:var(--ink-2); max-width:64ch; }

.block { display:flex; flex-direction:column; gap:14px; }
.block-label { display:flex; align-items:baseline; gap:9px; font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); border-bottom:1px solid var(--line-soft); padding-bottom:7px; }
.block-label b { color:var(--ink); font-weight:600; letter-spacing:.13em; }
.prose { display:flex; flex-direction:column; gap:13px; max-width:70ch; color:var(--ink-2); }
.prose strong { color:var(--ink); font-weight:600; }
.prose em { font-style:normal; color:var(--model); font-weight:500; }
.prose code { background:var(--surface-3); padding:1px 5px; border-radius:4px; font-size:.88em; color:var(--ink); }
.prose ul { margin:0; padding-left:20px; display:flex; flex-direction:column; gap:7px; }
.prose h5 { font-size:15px; color:var(--ink); margin-top:4px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.pad { padding:18px; }
.breaks { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; background:var(--warn-bg); border:1px solid color-mix(in srgb,var(--warn) 26%,transparent); border-radius:var(--radius); padding:13px 15px; }
.breaks .k { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--warn); padding-top:3px; white-space:nowrap; }
.breaks .v { color:var(--ink); font-size:14.3px; }
.keypoint { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; background:var(--code-bg); border:1px solid color-mix(in srgb,var(--code) 22%,transparent); border-radius:var(--radius); padding:13px 15px; }
.keypoint .k { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--code); padding-top:3px; white-space:nowrap; }
.keypoint .v { color:var(--ink); font-size:14.3px; }

/* ---------- figures ---------- */
.figure { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; gap:12px; }
.figure .cap { font-size:13.2px; color:var(--ink-3); font-family:var(--mono); font-size:11.5px; line-height:1.6; }
.figscroll { overflow-x:auto; }
.figscroll svg { display:block; max-width:100%; height:auto; }

/* ---------- code ---------- */
.codeblock { border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--surface); }
.codebar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 13px; background:var(--surface-2); border-bottom:1px solid var(--line); }
.codebar .file { font-family:var(--mono); font-size:12px; color:var(--ink); font-weight:500; }
.codebar .hint { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase; }
.codescroll { overflow-x:auto; }
pre.code { margin:0; padding:13px 0; font-size:12.6px; line-height:1.72; min-width:max-content; }
.cl { display:block; padding:0 16px 0 0; position:relative; }
.cl .ln { display:inline-block; width:40px; padding-right:14px; text-align:right; color:var(--ink-3); opacity:.55; user-select:none; font-size:11.5px; }
.cl.note { cursor:help; }
.cl.note:hover,.cl.note.on { background:var(--model-bg); }
.cl.note .ln { color:var(--model); opacity:1; font-weight:600; }
.cl.hl { background:var(--code-bg); }
.cl.live { background:var(--model-bg); box-shadow:inset 3px 0 0 var(--model-b); }
.ffsrc { display:inline-block; font-family:var(--sans); font-size:10px; letter-spacing:.05em; text-transform:uppercase; padding:3px 8px; border-radius:99px; white-space:nowrap; }
.ffsrc.s00, .ffsrc.s01 { background:var(--pass-bg); color:var(--pass); }
.ffsrc.snext { background:var(--code-bg); color:var(--code); }
.ffsrc.snew { background:var(--model-bg); color:var(--model); }
.ffsrc.snone { background:var(--surface-3); color:var(--ink-3); }
.q-show { margin-top:11px; }
.notes { display:flex; flex-direction:column; gap:8px; }
.note-row { display:grid; grid-template-columns:46px 1fr; gap:12px; align-items:start; font-size:13.6px; color:var(--ink-2); }
.note-row .nl { font-family:var(--mono); font-size:11px; color:var(--model); background:var(--model-bg); border-radius:4px; padding:2px 0; text-align:center; font-weight:600; }
.t-kw{color:var(--model)} .t-str{color:var(--pass)} .t-com{color:var(--ink-3); font-style:italic} .t-num{color:var(--code)}
.codeblock.pseudo .codebar { background:var(--model-bg); border-color:color-mix(in srgb,var(--model) 25%,transparent); }
.codeblock.pseudo .codebar .file,.codeblock.pseudo .codebar .hint { color:var(--model); }

/* ---------- quiz ---------- */
.quiz { display:flex; flex-direction:column; gap:14px; }
.q { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:17px 18px; display:flex; flex-direction:column; gap:13px; box-shadow:var(--shadow); }
.q-stem { font-size:15px; color:var(--ink); font-weight:500; }
.q-stem .mono { background:var(--surface-3); padding:1px 5px; border-radius:4px; font-size:.87em; }
.opts { display:flex; flex-direction:column; gap:7px; }
.opt { display:grid; grid-template-columns:20px 1fr; gap:11px; align-items:start; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); padding:10px 13px; border-radius:7px; cursor:pointer; font-family:var(--sans); font-size:14px; line-height:1.5; transition:.13s; }
.opt:hover:not([disabled]) { border-color:var(--code-b); color:var(--ink); }
.opt .k { font-family:var(--mono); font-size:11.5px; color:var(--ink-3); padding-top:2px; }
.opt[disabled] { cursor:default; }
.opt.right { background:var(--pass-bg); border-color:var(--pass); color:var(--ink); }
.opt.right .k { color:var(--pass); }
.opt.wrong { background:var(--warn-bg); border-color:var(--warn); color:var(--ink); }
.opt.wrong .k { color:var(--warn); }
.verdict { display:none; gap:10px; font-size:14px; padding:12px 14px; border-radius:7px; }
.verdict.show { display:grid; grid-template-columns:auto 1fr; }
.verdict .vk { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding-top:3px; }
.verdict.ok { background:var(--pass-bg); color:var(--ink); } .verdict.ok .vk { color:var(--pass); }
.verdict.no { background:var(--warn-bg); color:var(--ink); } .verdict.no .vk { color:var(--warn); }

/* ---------- acceptance ---------- */
.accept { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow); }
.accept h4 { font-size:15.5px; }
.criteria { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
.criteria li { display:grid; grid-template-columns:18px 1fr; gap:11px; align-items:start; font-size:14px; color:var(--ink-2); }
.criteria .mark { width:15px; height:15px; border:1.5px solid var(--line); border-radius:4px; margin-top:3px; display:grid; place-items:center; }
.criteria li.met .mark { background:var(--pass); border-color:var(--pass); }
.criteria li.met .mark::after { content:"✓"; color:#fff; font-size:10px; line-height:1; }
.accept-foot { display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-top:1px solid var(--line-soft); padding-top:14px; }
.accept-state { font-family:var(--mono); font-size:11.5px; color:var(--ink-3); }
.accept-state.done { color:var(--pass); }

/* ---------- generic widget shell ---------- */
.stage { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
.stage + .stage { margin-top:14px; }
.stage-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.stage-title { font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.stage-ctl { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
.stage-body { padding:18px; }
.readout { font-family:var(--mono); font-size:12.4px; color:var(--ink-2); line-height:1.7; }
.statebox { background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:10px 12px; font-family:var(--mono); font-size:11.6px; color:var(--ink-2); white-space:pre-wrap; word-break:break-word; line-height:1.65; }
.statebox .key { color:var(--code); }
.statebox .acc { color:var(--model); }
.panel { border:1px solid var(--line); border-radius:8px; padding:15px; background:var(--surface-2); display:flex; flex-direction:column; gap:11px; }
.panel h5 { font-size:15px; color:var(--ink); }
.panel .d { font-size:13.6px; color:var(--ink-2); }
.split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start; }
.split.wide-left { grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); }
@media (max-width:820px){ .split,.split.wide-left { grid-template-columns:1fr; } }

/* chips, switches, pickers */
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { font-family:var(--mono); font-size:10.8px; padding:3px 8px; border-radius:99px; border:1px solid var(--line); color:var(--ink-3); background:var(--surface); }
.chip.live { border-color:var(--code-b); color:var(--code); background:var(--code-bg); }
.chip.picked { border-color:var(--model-b); color:var(--model); background:var(--model-bg); font-weight:600; }
.chip.bad { border-color:var(--warn); color:var(--warn); background:var(--warn-bg); }
.switchrow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); }
.switchrow .lab { font-size:13.3px; color:var(--ink-2); }
.switchrow .lab b { display:block; font-family:var(--mono); font-size:11px; color:var(--ink); font-weight:600; }
.sw { width:40px; height:22px; border-radius:99px; border:1px solid var(--line); background:var(--surface-3); position:relative; cursor:pointer; flex:none; transition:.2s; }
.sw::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--ink-3); transition:.2s; }
.sw[aria-checked="true"] { background:var(--code-bg); border-color:var(--code-b); }
.sw[aria-checked="true"]::after { left:20px; background:var(--code); }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.scard { text-align:left; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:11px 13px; cursor:pointer; font-family:var(--sans); display:flex; flex-direction:column; gap:5px; transition:.15s; }
.scard:hover { border-color:var(--code-b); }
.scard[aria-pressed="true"] { border-color:var(--model-b); background:var(--model-bg); box-shadow:0 0 0 1px var(--model-b); }
.scard .sk { font-family:var(--mono); font-size:10.2px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.scard[aria-pressed="true"] .sk { color:var(--model); }
.scard .sq { font-size:13.2px; color:var(--ink); line-height:1.45; }
.slider { width:100%; accent-color:var(--code-b); }
.metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:9px; }
.metric { background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
.metric .mk { font-family:var(--mono); font-size:9.8px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); }
.metric .mv { font-family:var(--mono); font-size:18px; color:var(--ink); font-variant-numeric:tabular-nums; }
.metric .mv.warn { color:var(--warn); } .metric .mv.good { color:var(--pass); } .metric .mv.acc { color:var(--model); }
.metric .ms { font-size:11.4px; color:var(--ink-3); }

/* message list */
.msgs { display:flex; flex-direction:column; gap:8px; }
.msg { border:1px solid var(--line); border-left-width:3px; border-radius:7px; padding:9px 12px; background:var(--surface-2); animation:pop .26s ease; }
@keyframes pop { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
.msg .src { font-family:var(--mono); font-size:10.8px; letter-spacing:.04em; margin-bottom:3px; }
.msg .body { font-size:13.2px; color:var(--ink-2); }
.msg.user{border-left-color:var(--ink-3)} .msg.user .src{color:var(--ink-3)}
.msg.sys{border-left-color:var(--ink-3)} .msg.sys .src{color:var(--ink-3)}
.msg.model{border-left-color:var(--model-b)} .msg.model .src{color:var(--model)}
.msg.tool{border-left-color:var(--code-b)} .msg.tool .src{color:var(--code)}
.msg.merge{border-left-color:var(--code-b)} .msg.merge .src{color:var(--code)}
.msg.critic{border-left-color:var(--warn)} .msg.critic .src{color:var(--warn)}
.msg.summ{border-left-color:var(--pass)} .msg.summ .src{color:var(--pass)}
.msg.bad{border-left-color:var(--warn); background:var(--warn-bg)} .msg.bad .src{color:var(--warn)}

/* context window visual */
.ctxwrap { display:flex; flex-direction:column; gap:8px; }
.ctxbar { display:flex; height:30px; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--surface-3); }
.ctxseg { height:100%; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:9.5px; color:#fff; overflow:hidden; white-space:nowrap; transition:width .45s cubic-bezier(.4,0,.2,1); }
.ctxseg.sysm{background:#6E7B87} .ctxseg.task{background:var(--ink-2)} .ctxseg.think{background:var(--model-b)}
.ctxseg.act{background:var(--code-b)} .ctxseg.obs{background:#4F8FA8} .ctxseg.free{background:transparent}
.ctxlegend { display:flex; gap:14px; flex-wrap:wrap; font-family:var(--mono); font-size:10.6px; color:var(--ink-3); }
.ctxlegend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; font-style:normal; }

/* timeline */
.tl { display:flex; flex-direction:column; gap:14px; }
.tl-row { display:grid; grid-template-columns:136px 1fr 58px; gap:12px; align-items:center; }

<script>
/* ============================================================
   STORE
   ============================================================ */
const KEY = "agentstudio.v2";
/* Bump COURSE_VERSION to hand every student a clean slate on their next refresh
   (a new cohort, say). Leave it alone and progress survives every other edit:
   questions are keyed by their own content, so deleting a question orphans its
   record, adding one reads as unanswered, and editing one asks for a fresh
   answer. Nothing an edit can do leaves a student looking at a wrong state. */
const COURSE_VERSION = "2026-09-01";
const blank = () => ({ v:COURSE_VERSION, quiz:{}, explored:{}, evidence:[], exercise:{}, theme:null });
let S = blank();
try {
  const raw = localStorage.getItem(KEY);
  if (raw){
    const stored = JSON.parse(raw);
    if (stored && stored.v === COURSE_VERSION) S = Object.assign(blank(), stored);
    else { const theme = stored && stored.theme; S = blank(); S.theme = theme || null; }  // course was reset
  }
} catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const el = (t,c,h)=>{ const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ============================================================
   SYNTAX HIGHLIGHTING (python + pseudo-code)
   ============================================================ */
const KW_PY = "async|await|def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|try|except|finally|raise|None|True|False|lambda|is|pass|yield|self";
const KW_PS = "LOOP|WHILE|UNTIL|IF|ELSE|ELIF|THEN|END|RETURN|FOR|EACH|IN|CALL|APPEND|SET|BREAK|CONTINUE|FUNCTION|AND|OR|NOT|TRUE|FALSE|NULL|YIELD|PARALLEL|AWAIT|EMIT|STOP|GIVEN|DO";
function mkRx(kw){ return new RegExp("(#[^\\n]*)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*')|\\b(" + kw + ")\\b|\\b(\\d+(?:\\.\\d+)?)\\b","g"); }
const RX_PY = mkRx(KW_PY), RX_PS = mkRx(KW_PS);
function hiLine(line, lang){
  const rx = lang === "pseudo" ? RX_PS : RX_PY;
  return esc(line).replace(rx, (m,com,str,kw,num)=>{
    if (com) return '<span class="t-com">'+com+"</span>";
    if (str) return '<span class="t-str">'+str+"</span>";
    if (kw)  return '<span class="t-kw">'+kw+"</span>";
    return '<span class="t-num">'+num+"</span>";
  });
}
function codeHTML(block){
  const lang = block.lang || "py";
  const lines = block.code.replace(/^\n/,"").replace(/\n$/,"").split("\n");
  const notes = new Map((block.notes||[]).map(n=>[n[0],n[1]]));
  const hl = new Set(block.hl||[]);
  const start = block.start || 1;
  let inDoc=false, out="";
  lines.forEach((ln,i)=>{
    const no = start+i;
    const tri = (ln.match(/"""/g)||[]).length;
    let html;
    if (lang==="py" && inDoc){ html='<span class="t-com">'+esc(ln)+"</span>"; if(tri%2===1) inDoc=false; }
    else if (lang==="py" && tri===1){ html='<span class="t-com">'+esc(ln)+"</span>"; inDoc=true; }
    else if (lang==="py" && tri>=2){ html='<span class="t-com">'+esc(ln)+"</span>"; }
    else html = hiLine(ln, lang);
    out += '<span class="cl'+(notes.has(no)?" note":"")+(hl.has(no)?" hl":"")+'" data-ln="'+no+'"><span class="ln">'+no+"</span>"+html+"</span>";
  });
  let noteHTML="";
  if (block.notes && block.notes.length){
    noteHTML = '<div class="notes">'+block.notes.map(n=>'<div class="note-row" data-nl="'+n[0]+'"><div class="nl">'+n[0]+"</div><div>"+n[1]+"</div></div>").join("")+"</div>";
  }
  const hint = block.hint || (lang==="pseudo" ? "pseudo-code · the runnable Python is below" : "excerpt · line numbers follow the source file");
  return '<div class="codeblock'+(lang==="pseudo"?" pseudo":"")+'"><div class="codebar"><span class="file">'+esc(block.file)+
    '</span><span class="hint">'+hint+'</span></div><div class="codescroll"><pre class="code">'+out+"</pre></div></div>"+noteHTML;
}

/* ============================================================
   ANIMATION KIT
   ============================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs){ const n=document.createElementNS(SVGNS,tag); for(const k in (attrs||{})) n.setAttribute(k,attrs[k]); return n; }
function clipRect(node, tx, ty){
  const cx=node.x+node.w/2, cy=node.y+node.h/2;
  let dx=tx-cx, dy=ty-cy;
  if (dx===0 && dy===0) return [cx,cy];
  const sx = dx===0 ? Infinity : (node.w/2)/Math.abs(dx);
  const sy = dy===0 ? Infinity : (node.h/2)/Math.abs(dy);
  const s = Math.min(sx,sy);
  return [cx+dx*s, cy+dy*s];
}
/* spec: {w,h,nodes:[{id,x,y,w,h,label,sub,kind}],edges:[{from,to,bend,label,dashed}]} */
function makeGraph(host, spec){
  const svg = sv("svg",{viewBox:"0 0 "+spec.w+" "+spec.h, width:spec.w, height:spec.h, role:"img"});
  svg.style.maxWidth="100%"; svg.style.height="auto";
  const defs = sv("defs");
  ["arrow","arrowLive"].forEach((id,i)=>{
    const m = sv("marker",{id:id+"-"+(spec.uid||"g"),viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"6",markerHeight:"6",orient:"auto-start-reverse"});
    const p = sv("path",{d:"M 0 0 L 10 5 L 0 10 z"});
    p.setAttribute("fill", i? "var(--model-b)" : "var(--line)");
    m.appendChild(p); defs.appendChild(m);
  });
  svg.appendChild(defs);
  const gEdges = sv("g"), gNodes = sv("g"), gTokens = sv("g");
  svg.appendChild(gEdges); svg.appendChild(gNodes); svg.appendChild(gTokens);
  const byId = {}; spec.nodes.forEach(n=>byId[n.id]=n);
  const uid = spec.uid || "g";

  const edgeEls = {};
  (spec.edges||[]).forEach(e=>{
    const a=byId[e.from], b=byId[e.to];
    const [x1,y1]=clipRect(a, b.x+b.w/2, b.y+b.h/2);
    const [x2,y2]=clipRect(b, a.x+a.w/2, a.y+a.h/2);
    let d;
    if (e.bend){
      const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
      d = "M "+x1+" "+y1+" Q "+(mx - dy/L*e.bend)+" "+(my + dx/L*e.bend)+" "+x2+" "+y2;
    } else d = "M "+x1+" "+y1+" L "+x2+" "+y2;
    const p = sv("path",{d:d, fill:"none", stroke:"var(--line)", "stroke-width":"1.6", "marker-end":"url(#arrow-"+uid+")"});
    if (e.dashed) p.setAttribute("stroke-dasharray","5 4");
    gEdges.appendChild(p);
    edgeEls[e.from+">"+e.to]=p;
    if (e.label){
      const pt = p.getPointAtLength ? null : null;
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const t = sv("text",{x: mx + (e.lx||0), y: my + (e.ly||-7), "text-anchor":"middle", "font-size":"10", fill:"var(--ink-3)"});
      t.textContent = e.label; gEdges.appendChild(t);
    }
  });

  const nodeEls={};
  spec.nodes.forEach(n=>{
    const g = sv("g");
    const r = sv("rect",{x:n.x,y:n.y,width:n.w,height:n.h,rx:8,
      fill:"var(--surface-2)", stroke:"var(--line)", "stroke-width":"1.4"});
    g.appendChild(r);
    const lines = String(n.label).split("|");
    lines.forEach((ln,i)=>{
      const t = sv("text",{x:n.x+n.w/2, y:n.y+n.h/2 + (n.sub? -6:4) + i*13 - (lines.length-1)*6,
        "text-anchor":"middle","font-size":"11.5", fill:"var(--ink)","font-weight":"500"});
      t.textContent = ln; g.appendChild(t);
    });
    if (n.sub){
      const t2 = sv("text",{x:n.x+n.w/2, y:n.y+n.h-9, "text-anchor":"middle","font-size":"9", fill:"var(--ink-3)"});
      t2.textContent = n.sub; g.appendChild(t2);
    }
    gNodes.appendChild(g);
    nodeEls[n.id]={g,rect:r,spec:n};
    if (n.kind==="model") r.setAttribute("stroke","var(--model-b)");
    if (n.kind==="code")  r.setAttribute("stroke","var(--code-b)");
  });

  host.appendChild(svg);
  const api = {
    svg,
    hi(id,on){ const n=nodeEls[id]; if(!n) return;
      n.rect.setAttribute("fill", on? (n.spec.kind==="model"?"var(--model-bg)":"var(--code-bg)") : "var(--surface-2)");
      n.rect.setAttribute("stroke-width", on? "2.4":"1.4");
      n.rect.setAttribute("stroke", on? (n.spec.kind==="model"?"var(--model-b)":"var(--code-b)")
        : (n.spec.kind==="model"?"var(--model-b)":n.spec.kind==="code"?"var(--code-b)":"var(--line)"));
    },
    bad(id,on){ const n=nodeEls[id]; if(!n) return;
      n.rect.setAttribute("fill", on?"var(--warn-bg)":"var(--surface-2)");
      n.rect.setAttribute("stroke", on?"var(--warn)":(n.spec.kind==="model"?"var(--model-b)":n.spec.kind==="code"?"var(--code-b)":"var(--line)"));
    },
    dimAll(){ Object.keys(nodeEls).forEach(id=>{ api.hi(id,false); }); },
    edge(from,to,on){ const p=edgeEls[from+">"+to]; if(!p) return;
      p.setAttribute("stroke", on?"var(--model-b)":"var(--line)");
      p.setAttribute("stroke-width", on?"2.4":"1.6");
      p.setAttribute("marker-end","url(#"+(on?"arrowLive":"arrow")+"-"+uid+")");
    },
    clearEdges(){ Object.keys(edgeEls).forEach(k=>{ const [a,b]=k.split(">"); api.edge(a,b,false); }); },
    send(from,to,opt){
      opt = opt||{};
      const p = edgeEls[from+">"+to];
      if (!p) return Promise.resolve();
      const L = p.getTotalLength();
      const dot = sv("circle",{r:opt.r||6, fill:opt.color||"var(--model-b)", stroke:"var(--surface)","stroke-width":"1.5"});
      gTokens.appendChild(dot);
      let txt=null;
      if (opt.label){ txt = sv("text",{"font-size":"9.5", fill:"var(--ink-2)","text-anchor":"middle"}); txt.textContent=opt.label; gTokens.appendChild(txt); }
      const dur = opt.dur || 700;
      const t0 = performance.now();
      api.edge(from,to,true);
      return new Promise(res=>{
        function frame(now){
          const k = Math.min(1,(now-t0)/dur);
          const pt = p.getPointAtLength(L*k);
          dot.setAttribute("cx",pt.x); dot.setAttribute("cy",pt.y);
          if (txt){ txt.setAttribute("x",pt.x); txt.setAttribute("y",pt.y-11); }
          if (k<1) requestAnimationFrame(frame);
          else { dot.remove(); if(txt) txt.remove(); res(); }
        }
        requestAnimationFrame(frame);
      });
    },
    setSub(id,txt){ const n=nodeEls[id]; if(!n) return; const ts=n.g.querySelectorAll("text"); const last=ts[ts.length-1]; if(n.spec.sub && last) last.textContent=txt; },
  };
  return api;
}

/* control bar: play / step / reset */
</script>

<script>
/* ============================================================
   RENDER ENGINE
   ============================================================ */
let current = 0;
/* A question's saved answer is keyed by the question's own content, not by its
   position. Delete a question and its record is simply orphaned; add one and it
   reads as unanswered; edit the stem, the options or the correct answer and the
   old record no longer matches, so the student answers the new question afresh.
   Editing only the explanation does not invalidate anything. */
function qkey(q){
  const seed = String(q.q) + "\u0000" + (q.opts||[]).join("\u0000") + "\u0000" + q.a;
  let h = 5381;
  for (let i=0;i<seed.length;i++) h = ((h*33) ^ seed.charCodeAt(i)) >>> 0;
  return "q" + h.toString(36);
}
function quizPassed(n){ if(!n.quiz||!n.quiz.length) return true; const r=S.quiz[n.id]||{}; return n.quiz.every(q=>{const k=qkey(q); return r[k]&&r[k].correct;}); }
function nodeDone(n){ const need = !!(n.widgets&&n.widgets.length); return quizPassed(n) && (!need || !!S.explored[n.id]); }
function accepted(n){ return S.evidence.some(e=>e.id===n.id); }

function renderRail(){
  const ul = $("#railList"); ul.innerHTML="";
  let lastPart=null;
  NODES.forEach((n,i)=>{
    if (n.part !== lastPart){ lastPart=n.part; const h=el("li","rail-part",n.part); ul.appendChild(h); }
    const li=el("li");
    const b=el("button","rail-item"+(accepted(n)?" done":""));
    b.setAttribute("aria-current", i===current?"true":"false");
    b.innerHTML='<span class="rail-num">'+n.num+'</span><span>'+n.title+'</span><span class="rail-dot"></span>';
    b.onclick=()=>go(i);
    li.appendChild(b); ul.appendChild(li);
  });
  const acc = NODES.filter(accepted).length;
  $("#pmLabel").textContent = acc+" / "+NODES.length+" accepted";
  $("#pmPct").textContent = Math.round(acc/NODES.length*100)+"%";
  $("#pmFill").style.width = (acc/NODES.length*100)+"%";
}
function go(i){ current=Math.max(0,Math.min(NODES.length-1,i)); renderNode(); renderRail(); window.scrollTo(0,0);
  const cur=$('.rail-item[aria-current="true"]'); if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:"nearest",inline:"nearest"}); }

function renderNode(){
  const n = NODES[current], root = $("#nodeRoot");
  root.innerHTML="";

  /* part banner on the first node of each part */
  if (current===0 || NODES[current-1].part !== n.part){
    const meta = PARTS[n.part];
    if (meta){
      const pb = el("div","partbanner");
      pb.innerHTML = '<div class="pk">'+n.part+'</div><h3>'+meta.title+'</h3>'+
        '<p class="pt">'+meta.tag+'</p>'+
        '<ul class="objectives">'+meta.obj.map((o,i)=>'<li><span class="on">'+(i+1)+'</span><span>'+o+'</span></li>').join("")+'</ul>'+
        '<div class="pb-meta">page '+meta.nodes+' · by the end of this part you should be able to do all of the above without the page open</div>';
      root.appendChild(pb);
    }
  }

  const head = el("div","node-head");
  head.innerHTML =
    '<div class="eyebrow"><span>'+n.part+' · '+n.num+'</span>'+(n.tagText?'<span class="tag '+(n.tag||"mixed")+'">'+n.tagText+'</span>':'')+'</div>'+
    "<h2>"+n.title+"</h2><p class=\"lede\">"+n.lede+"</p>";
  root.appendChild(head);

  if (n.pipeline){
    const sec = el("section","block");
    sec.innerHTML = '<div class="block-label"><b>Where you are</b><span>the whole FlightFinder pipeline · this node is highlighted</span></div>';
    const strip = el("div","pipestrip");
    const holder = el("div","figscroll");
    strip.appendChild(holder);
    if (n.pipeNote) strip.appendChild(el("div","cap", n.pipeNote));
    sec.appendChild(strip); root.appendChild(sec);
    figFFPipeline(n.stageHi||[])(holder);
  }

  const brief = el("section","block");
  brief.innerHTML = '<div class="block-label"><b>'+(n.briefLabel||"Concept")+'</b><span>'+(n.briefHint||"read this first")+'</span></div><div class="prose">'+n.brief+"</div>";
  if (n.key) brief.appendChild(el("div","keypoint",'<div class="k">the idea</div><div class="v">'+n.key+"</div>"));
  if (n.breaks) brief.appendChild(el("div","breaks",'<div class="k">breaks if weak</div><div class="v">'+n.breaks+"</div>"));
  root.appendChild(brief);

  if (n.figure){
    const sec = el("section","block");
    sec.innerHTML = '<div class="block-label"><b>Figure</b><span>'+(n.figureHint||"the shape of it")+'</span></div>';

  }

  if (n.widgets && n.widgets.length){
    const sec = el("section","block");
    sec.innerHTML = '<div class="block-label"><b>'+(n.mechLabel||"Mechanism")+'</b><span>'+(n.mechHint||"run it")+'</span></div>';
    n.widgets.forEach(w=>{
      if (w.intro){ sec.appendChild(el("div","prose",w.intro)); }
      const host = el("div");
      sec.appendChild(host);
      root.appendChild(sec);
      w.fn(host, ()=>{ S.explored[n.id]=true; save(); refreshAccept(); renderRail(); });
    });
    if (!sec.parentNode) root.appendChild(sec);
  }

  if (n.code && n.code.length){
    const sec = el("section","block");
    sec.innerHTML = '<div class="block-label"><b>'+(n.codeLabel||"Code")+'</b><span>'+(n.codeHint||"what it looks like written down")+'</span></div>';

      wrap.innerHTML = (b.intro?'<div class="prose">'+b.intro+"</div>":"")+codeHTML(b);
      sec.appendChild(wrap);
    });
    root.appendChild(sec);
    $$(".note-row",root).forEach(row=>{
      const ln=row.dataset.nl;
      row.onmouseenter=()=>$$('.cl[data-ln="'+ln+'"]',root).forEach(c=>c.classList.add("on"));
      row.onmouseleave=()=>$$('.cl[data-ln="'+ln+'"]',root).forEach(c=>c.classList.remove("on"));

    sec.innerHTML = '<div class="block-label"><b>Check</b><span>'+n.quiz.length+" question"+(n.quiz.length>1?"s":"")+" · immediate feedback</span></div>";
    const box = el("div","quiz");
    n.quiz.forEach((q,qi)=>box.appendChild(quizCard(n,q,qi)));

  }

  const sec = el("section","block");
  sec.innerHTML = '<div class="block-label"><b>Acceptance</b><span>what you must be able to defend</span></div>';

  $("#btnNext").style.visibility = current===NODES.length-1?"hidden":"visible";

}

function quizCard(node,q,qi){
  const card=el("div","q"); card.dataset.nid=node.id; card.dataset.qk=qkey(q);
  const rec=(S.quiz[node.id]||{})[qkey(q)];
  card.innerHTML='<div class="q-stem">'+q.q+"</div>";
  const opts=el("div","opts");
  q.opts.forEach((text,oi)=>{
    const b=el("button","opt");
    b.innerHTML='<span class="k">'+"ABCD"[oi]+'</span><span>'+text+"</span>";
    b.onclick=()=>answer(node,q,qi,oi,card);
    opts.appendChild(b);
  });
  card.appendChild(opts);
  const show=el("button","btn tiny q-show","Show the answer");
  show.onclick=()=>reveal(node,q,card);
  card.appendChild(show);
  card.appendChild(el("div","verdict"));
  if (rec) paint(card,q,rec.revealed?null:rec.choice);
  return card;
}
function reveal(node,q,card){
  S.quiz[node.id]=S.quiz[node.id]||{};
  S.quiz[node.id][qkey(q)]={choice:null,correct:true,revealed:true,tries:0};
  save(); paint(card,q,null); refreshAccept(); renderRail();
}
function paint(card,q,choice){
  const shown = choice===null;
  $$(".opt",card).forEach((b,i)=>{ b.disabled=true; if(i===q.a) b.classList.add("right"); else if(i===choice) b.classList.add("wrong"); });
  const sb=$(".q-show",card); if(sb) sb.remove();
  const v=$(".verdict",card), ok=shown||choice===q.a;
  v.className="verdict show "+(ok?"ok":"no");
  v.innerHTML='<div class="vk">'+(shown?"the answer":(ok?"correct":"not quite"))+"</div><div>"+q.why+"</div>";
  if(!ok){
    const retry=el("button","btn tiny","Try again"); retry.style.marginTop="10px";
    retry.onclick=()=>{ const nid=card.dataset.nid, k=card.dataset.qk; if(S.quiz[nid]) delete S.quiz[nid][k]; save(); renderNode(); };
    v.appendChild(retry);
  }
}
function answer(node,q,qi,oi,card){
  S.quiz[node.id]=S.quiz[node.id]||{};
  const k=qkey(q);
  const prev=S.quiz[node.id][k];
  S.quiz[node.id][k]={choice:oi,correct:oi===q.a,tries:(prev?prev.tries:0)+1};
  save(); paint(card,q,oi); refreshAccept(); renderRail();
}
function refreshAccept(){
  const n=NODES[current], box=$("#acceptBox"); if(!box) return;
  const done=nodeDone(n), already=accepted(n), rec=S.quiz[n.id]||{};
  const passed=(n.quiz||[]).filter(q=>{const k=qkey(q); return rec[k]&&rec[k].correct;}).length;
  const crit=[];
  if (n.widgets&&n.widgets.length) crit.push([!!S.explored[n.id],"Ran the interactive demo at least once"]);
  if (n.quiz&&n.quiz.length) crit.push([passed===n.quiz.length,"Passed all checks ("+passed+"/"+n.quiz.length+")"]);
  (n.criteria||[]).forEach(c=>crit.push([done,c]));
  box.innerHTML="<h4>"+n.claim+"</h4>"+
    '<ul class="criteria">'+crit.map(c=>'<li class="'+(c[0]?"met":"")+'"><span class="mark"></span><span>'+c[1]+"</span></li>").join("")+"</ul>"+
    '<div class="accept-foot"></div>';
  const foot=$(".accept-foot",box);
  const btn=el("button","btn primary", already?"Recorded ✓":"Accept & record evidence");
  btn.disabled=!done||already;
  btn.onclick=()=>{
    const tries=(n.quiz||[]).reduce((a,q)=>{const k=qkey(q); return a+((rec[k]&&rec[k].tries)||0);},0);
    S.evidence.push({id:n.id,num:n.num,title:n.title,claim:n.claim,part:n.part,ts:new Date().toISOString(),checks:(n.quiz||[]).length,tries});
    save(); refreshAccept(); renderRail();
  };
  const state=el("span","accept-state"+(already?" done":""));
  state.textContent = already?"signed into the evidence ledger":(done?"ready to record":"complete the items above to unlock");
  foot.appendChild(btn); foot.appendChild(state);
}
/* evidence drawer */
function openDrawer(){
  const m=$("#drawerMount");
  const bg=el("div","drawer-bg"); bg.onclick=closeDrawer;
  const d=el("div","drawer");
  /* Only entries for nodes that still exist, and always the node's CURRENT claim
     text - so an edit to a claim is reflected rather than frozen at accept time. */
  const live = S.evidence.map(e=>{ const n = NODES.find(x=>x.id===e.id); return n ? Object.assign({}, e, {claim:n.claim, title:n.title, num:n.num}) : null; })
                         .filter(Boolean);
  const rows=live.length
    ? live.slice().sort((a,b)=>a.num.localeCompare(b.num)).map(e=>
      '<div class="ev"><div class="eh"><span class="en">'+e.num+'</span><span class="et">'+new Date(e.ts).toLocaleString()+
      '</span></div><div class="ec">'+e.claim+'</div><div class="em">'+e.title+" · "+e.checks+" checks · "+e.tries+" attempts</div></div>").join("")
    : '<div class="empty">No evidence yet. Accept a node to sign its claim into the ledger.</div>';
  d.innerHTML='<div class="drawer-head"><div><h3>Evidence ledger</h3><p>Every accepted node appends a claim you should be able to defend out loud.</p></div>'+
    '<button class="btn tiny" id="drawerClose">Close</button></div><div class="drawer-body">'+rows+"</div>"+
    '<div class="drawer-foot"><button class="btn" id="evCopy">Copy as Markdown</button><button class="btn" id="evReset">Reset all progress</button></div>';
  m.appendChild(bg); m.appendChild(d);
  $("#drawerClose").onclick=closeDrawer;
  $("#evCopy").onclick=()=>{
    const md="# Agentic Systems Studio — evidence chain\n\n"+live.map(e=>
      "- **"+e.num+" · "+e.title+"** — "+e.claim+"  \n  _"+new Date(e.ts).toLocaleString()+" · "+e.checks+" checks · "+e.tries+" attempts_").join("\n");
    navigator.clipboard.writeText(md).then(()=>{ $("#evCopy").textContent="Copied ✓"; setTimeout(()=>{const b=$("#evCopy"); if(b)b.textContent="Copy as Markdown";},1600); });
  };
  $("#evReset").onclick=()=>{ S=blank(); save(); closeDrawer(); renderNode(); renderRail(); };
}
function closeDrawer(){ $("#drawerMount").innerHTML=""; }
$("#btnEvidence").onclick=openDrawer;

function wRouting(host, done){
  host.innerHTML=`<div class="stage">
    <div class="stage-bar"><span class="stage-title">Pick a run, then step through every routing decision</span>
      <span class="stage-ctl"><button class="btn tiny" id="rtStep">Step →</button><button class="btn tiny" id="rtAll">Run to end</button>
      <button class="btn tiny" id="rtReset">Reset</button></span></div>
    <div class="stage-body" style="display:flex;flex-direction:column;gap:16px">
      <div class="grid2" id="rtScen"></div>
      <div class="split">
        <div><div class="stage-title" style="margin-bottom:9px">Team transcript</div><div class="msgs" id="rtMsgs"></div></div>
        <div class="decision" id="rtDec"></div>
      </div>
    </div></div>`;
  const scenWrap=host.querySelector("#rtScen"), msgs=host.querySelector("#rtMsgs"), dec=host.querySelector("#rtDec");
  let si=0, pi=0;
  SCEN.forEach((s,i)=>{ const b=el("button","scard"); b.setAttribute("aria-pressed",i===0?"true":"false");
    b.innerHTML=`<span class="sk">Run ${s.k} · ${s.label}</span><span class="sq">${s.q}</span>`;
    b.onclick=()=>{ si=i; Array.from(scenWrap.children).forEach((x,j)=>x.setAttribute("aria-pressed",j===i?"true":"false")); reset(); done(); };
    scenWrap.appendChild(b); });
  function guards(){
    const st=SCEN[si].steps.slice(0,pi);
    const msgN=st.filter(s=>s.t==="msg").length;
    const criticN=st.filter(s=>s.t==="msg"&&s.src==="budget_critic_agent").length;
    const ended=st.some(s=>s.t==="end");
    return `<div class="guards">
      <div class="guard ${criticN>1?"trip":""}"><span>MAX_CRITIC_RETRIES</span><b>${criticN} / 1 critic turns</b></div>
      <div class="guard"><span>MaxMessageTermination</span><b>${msgN} / 12 messages</b></div>
      <div class="guard ${ended?"trip":""}"><span>SourceMatchTermination</span><b>${ended?"fired · summarizer spoke":"watching for summarizer"}</b></div></div>`;
  }
  function paintDec(step, revealed){
    if (step && step.t==="dec" && step.cands.length===1) revealed=true;
    if (!step){ dec.innerHTML=`<div class="dstep"><span class="dk">next</span><span class="dv">press Step →</span></div>`+guards(); return; }
    if (step.t==="end"){ dec.innerHTML=`<div class="dstep"><span class="dk">terminated</span><span class="dv" style="color:var(--pass)">run complete</span></div>
      <div style="font-size:13.3px;color:var(--ink-2)">${step.body}</div>`+guards(); return; }
    if (step.t==="msg"){ dec.innerHTML=`<div class="dstep"><span class="dk">speaking</span><span class="dv">${step.src}</span></div>`+guards(); return; }
    const chips=step.cands.map(c=>`<span class="chip ${revealed&&c===step.pick?"picked":"live"}">${c}</span>`).join("");
    let predictHTML="";
    if (!revealed && step.cands.length>1)
      predictHTML=`<div class="predict"><div class="pq">Before revealing: who speaks next?</div>
        <div class="chips" id="rtPredict">${step.cands.map(c=>`<button class="btn tiny" data-c="${c}">${c}</button>`).join("")}</div></div>`;
    dec.innerHTML=`
      <div class="dstep ${step.by==="code"?"by-code":"by-model"}"><span class="dk">who is deciding</span>
        <span class="dv">${step.by==="code"?"selector_func — deterministic code":"the model — the one autonomous choice"}</span></div>
      <div class="dstep"><span class="dk">trigger</span><span class="dv" style="font-size:11.4px">${step.trig}</span></div>
      <div class="dstep"><span class="dk">candidate_func ballot</span><div class="chips">${chips}</div></div>
      ${revealed?`<div class="dstep"><span class="dk">chosen</span><span class="dv" style="color:${step.by==="code"?"var(--code)":"var(--model)"}">${step.pick}</span></div>
        <div style="font-size:13.2px;color:var(--ink-2)">${step.why}</div>`:predictHTML}
      ${guards()}`;
    if (!revealed && step.cands.length>1){
      dec.querySelectorAll("#rtPredict button").forEach(b=>{
        b.onclick=()=>{
          const ok=b.dataset.c===step.pick;
          paintDec(step,true);
          const v=el("div","verdict show "+(ok?"ok":"no"));
          v.innerHTML=`<div class="vk">${ok?"called it":"not this time"}</div><div>You predicted <b>${b.dataset.c}</b>.</div>`;
          dec.insertBefore(v,dec.firstChild);
        };
      });
    }
  }
  function step(){
    const s=SCEN[si].steps[pi]; if(!s) return;
    if (s.t==="msg"){
      const d=el("div","msg "+s.cls);
      d.innerHTML=`<div class="src">${s.src}</div><div class="body">${s.body}</div>`;
      msgs.appendChild(d); pi++; paintDec(SCEN[si].steps[pi],false);
    } else { paintDec(s,true); pi++; }
    done();
  }
  function reset(){ pi=0; msgs.innerHTML=""; paintDec(null); }
  host.querySelector("#rtStep").onclick=step;
  host.querySelector("#rtReset").onclick=reset;
  host.querySelector("#rtAll").onclick=()=>{ const iv=setInterval(()=>{ if(pi>=SCEN[si].steps.length){clearInterval(iv);return;} step(); },620); };
  reset();
}

<script>
/* ============================================================
   FF — the FlightFinder logic, ported line-by-line to JavaScript
   so it can actually execute in this page. The Python original
   sits beside each panel; behaviour is intended to match.
   ============================================================ */
const FF = (() => {
  const MAX_CONTENT_CHARS = 8000;
  const PRICE_RX = /\$\s?\d[\d,]*/g;

  /* ---- tools.py ---- */
  function kayakSearchUrl(dep, dest, date, ret){
    let url = `https://www.kayak.com/flights/${dep}-${dest}/${date}`;
    if (ret) url += `/${ret}`;
    return url + "?currency=USD";
  }
  function condense(text){
    text = text.replace(/!\[[^\]]*\]\([^)]*\)/g, " ");
    text = text.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");
    const lines = [];
    for (const raw of text.split("\n")){
      const line = raw.trim();
      if (!line) continue;
      if (!/[0-9A-Za-z\u4e00-\u9fff]/.test(line)) continue;   // CJK range as escapes: safe on any charset
      lines.push(line);
    }
    const dedup = [];
    for (const line of lines){ if (dedup.length && dedup[dedup.length-1] === line) continue; dedup.push(line); }
    return dedup.join("\n");
  }
  function sliceAroundPrices(text, limit){
    limit = limit || MAX_CONTENT_CHARS;
    const total = text.length;
    const matches = [...text.matchAll(PRICE_RX)];
    const n = matches.length;
    if (total <= limit){
      return { header:`[fetch diagnostic] Page text has ${total} characters, was not truncated, and contains ${n} price markers.`,
               body:text, kept:n, total:n, start:0, end:total };
    }
    if (n === 0){
      return { header:`[fetch diagnostic] Page text has ${total} characters, but no price marker ($) was detected. The flight list may not have rendered successfully. Showing the first ${limit} characters for diagnosis.`,
               body:text.slice(0,limit), kept:0, total:0, start:0, end:limit };
    }
    const first = matches[0].index;
    const start = Math.max(0, first - 500);
    const end = Math.min(total, start + limit);
    const body = text.slice(start, end);
    const kept = (body.match(PRICE_RX)||[]).length;
    return { header:`[fetch diagnostic] Page text has ${total} characters and ${n} price markers; the first price starts at character ${first}. The slice below covers characters ${start}-${end}, which should be the flight-list region rather than the top navigation.`,
             body, kept, total:n, start, end };
  }
  /* naive comparison, for the demo */
  function truncateTop(text, limit){
    limit = limit || MAX_CONTENT_CHARS;
    const body = text.slice(0, limit);
    return { header:`[naive] text[:${limit}] — cut from the top of the page.`, body,
             kept:(body.match(PRICE_RX)||[]).length, total:(text.match(PRICE_RX)||[]).length, start:0, end:limit };
  }

  /* ---- fanout.py ---- */
  const MAX_SEARCH_DATES = 3;
  const DAY = 86400000;
  function asDate(value){
    /* _as_date(): parse one ISO date without letting malformed model output escape the guard.
       fromisoformat() takes the dashed and the compact form; Date.UTC would roll a bad day
       over instead of failing, so the parts are round-tripped. */
    const s = String(value||"").trim();
    if (!s) return null;
    const iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s) || /^(\d{4})(\d{2})(\d{2})$/.exec(s);
    if (!iso) return null;
    const d = new Date(Date.UTC(+iso[1], +iso[2]-1, +iso[3]));
    if (isNaN(d.getTime()) || d.toISOString().slice(0,10) !== iso[1]+"-"+iso[2]+"-"+iso[3]) return null;
    return d;
  }
  const isoOf = d => d.toISOString().slice(0,10);
  const addDays = (d, k) => new Date(d.getTime() + k*DAY);
  const daysBetween = (a, b) => Math.round((b.getTime() - a.getTime()) / DAY);
  function pyRound(x){
    /* Python's round() is round-half-to-even; Math.round is round-half-up. */
    const f = Math.floor(x), r = x - f;
    if (r > 0.5) return f + 1;
    if (r < 0.5) return f;
    return (f % 2 === 0) ? f : f + 1;
  }
  function planSearchDates(date, windowStart, windowEnd, includeFlex, maxDates, todayStr){
    /* plan_search_dates(): turn a model-interpreted date window into a small deterministic
       search plan. Keeps start, end and the preferred date when possible; clips the past;
       degrades to the preferred date when the interval is malformed. The fan-out budget guard. */
    if (maxDates == null) maxDates = MAX_SEARCH_DATES;
    if (maxDates < 1) return [];
    const anchor = asDate(date);
    if (anchor === null) return [date];
    if (!includeFlex) return [isoOf(anchor)];
    const current = asDate(todayStr);
    let start = asDate(windowStart), end = asDate(windowEnd);
    if (start === null || end === null){ start = addDays(anchor, -1); end = addDays(anchor, 1); }
    if (start > end) return [isoOf(anchor)];
    if (current > start) start = current;
    if (end < start) return [isoOf(anchor)];
    const dayCount = daysBetween(start, end) + 1;
    if (dayCount <= maxDates){
      const out = []; for (let i = 0; i < dayCount; i++) out.push(isoOf(addDays(start, i))); return out;
    }
    if (maxDates === 1){
      const chosen = (start <= anchor && anchor <= end) ? anchor : start; return [isoOf(chosen)];
    }
    const chosen = new Map(); const put = d => chosen.set(isoOf(d), d);
    put(start); put(end);
    const interiorSlots = maxDates - 2;
    for (let i = 1; i <= interiorSlots; i++){
      const offset = pyRound(i * (dayCount - 1) / (interiorSlots + 1));
      put(addDays(start, offset));
    }
    if (interiorSlots && start < anchor && anchor < end && !chosen.has(isoOf(anchor))){
      const interior = Array.from(chosen.values()).filter(d => isoOf(d) !== isoOf(start) && isoOf(d) !== isoOf(end));
      if (interior.length){
        let best = interior[0];
        for (const d of interior) if (Math.abs(daysBetween(anchor, d)) < Math.abs(daysBetween(anchor, best))) best = d;
        chosen.delete(isoOf(best));
      }
      put(anchor);
    }
    return Array.from(chosen.keys()).sort().slice(0, maxDates);
  }
  function computeFlexDate(dateStr, todayStr){
    /* compatibility helper for the former one-day-earlier example, as in fanout.py */
    const planned = planSearchDates(dateStr, null, null, true, 2, todayStr);
    const earlier = planned.filter(c => c < String(dateStr));
    return { value: earlier.length ? earlier[0] : null, why: earlier.length ? "one day earlier, still in the future" : "no usable earlier date" };
  }
  function computeFlexDate_v1(dateStr, todayStr){
    /* fromisoformat() takes both the dashed and the compact ISO form, so we do too. */
    const s = String(dateStr||"").trim();
    const iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s) || /^(\d{4})(\d{2})(\d{2})$/.exec(s);
    if (!iso) return { value:null, why:"fromisoformat() raised — the string is not YYYY-MM-DD" };
    const d = new Date(Date.UTC(+iso[1], +iso[2]-1, +iso[3]));
    /* Date.UTC rolls a bad day over instead of failing: month 13 quietly becomes
       next January. fromisoformat() raises. Round-trip the parts so we do too. */
    if (isNaN(d.getTime()) || d.toISOString().slice(0,10) !== iso[1]+"-"+iso[2]+"-"+iso[3])
      return { value:null, why:"fromisoformat() raised — not a real date" };
    const flex = new Date(d.getTime() - 86400000);
    const today = new Date(todayStr + "T00:00:00Z");
    if (flex < today) return { value:null, why:"the nearby date is in the past — skip a session that could only return nothing" };
    return { value: flex.toISOString().slice(0,10), why:"one day earlier, still in the future" };
  }

  /* ---- agents_advanced.py ---- */
  const MAX_CRITIC_RETRIES = 1;
  function criticVerdict(content){
    if (typeof content !== "string") return "APPROVED";
    const head = content.replace(/^[#*_`>\-~"'\u201c\u201d\u2018\u2019 \t\r\n]+/, "").slice(0,40).toUpperCase();
    for (const v of ["NO_DATA","RETRY","APPROVED"]) if (head.startsWith(v)) return v;
    return "APPROVED";
  }
  function candidateFunc(messages){
    if (!messages.length) return ["merge_ranker_agent"];
    const src = messages[messages.length-1].source;
    if (src === "merge_ranker_agent") return ["budget_critic_agent","summarizer_agent"];
    if (src === "budget_critic_agent") return ["merge_ranker_agent","summarizer_agent"];
    if (src === "summarizer_agent") return ["summarizer_agent"];
    return ["merge_ranker_agent"];
  }
  function selectorFunc(messages){
    if (!messages.length) return "merge_ranker_agent";
    const last = messages[messages.length-1];
    const source = last.source;
    if (source == null || source === "user") return "merge_ranker_agent";
    if (source === "merge_ranker_agent"){
      const prev = messages.length >= 2 ? messages[messages.length-2].source : null;
      if (prev === "merge_ranker_agent"){
        const criticSpoke = messages.some(m => m.source === "budget_critic_agent");
        return criticSpoke ? "summarizer_agent" : "budget_critic_agent";
      }
      return null;                        // <- the one line that grants autonomy
    }
    if (source === "budget_critic_agent"){
      const turns = messages.filter(m => m.source === "budget_critic_agent").length;
      const verdict = criticVerdict(last.content);
      if (verdict === "RETRY" && turns <= MAX_CRITIC_RETRIES) return "merge_ranker_agent";
      return "summarizer_agent";
    }
    return null;
  }

  /* ---- observability: a stated heuristic, not a billing API ---- */
  const est = s => Math.ceil(String(s||"").length / 4);

  return { MAX_CONTENT_CHARS, PRICE_RX, kayakSearchUrl, condense, sliceAroundPrices, truncateTop,
           computeFlexDate, planSearchDates, MAX_SEARCH_DATES, MAX_CRITIC_RETRIES, criticVerdict, candidateFunc, selectorFunc, est };
})();

function derivedFlights(date){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date||""))) return [];
  let seed = 0; for (const ch of date) seed = (seed * 31 + ch.charCodeAt(0)) % 997;
  const base = FLIGHT_DATA["2026-11-05"];
  return base.map(function(f, i){
    const bump = ((seed + i * 37) % 45) - 12;
    return [f[0], f[1], f[2], f[3], f[4], f[5] + bump];
  });
}
function fakeRawPage(date, opts){
  opts = opts || {};
  const junkLine = i => [
    `[Flights](https://www.kayak.com/flights)`,
    `![airline logo](https://cdn.example/logo${i%7}.png)`,
    `   `, `— — —`, `***`,
    `Filter by stops`, `Filter by stops`,
    `Bags   Carry-on included`, `Sort by: Best`,
    `Nearby airports`, `Price alerts`, `Hacker Fares`,
  ][i % 12];
  const head = [];
  for (let i=0;i<1150;i++) head.push(junkLine(i));
  const rows = [];
  (FLIGHT_DATA[date] || derivedFlights(date)).forEach(f => {
    if (opts.noPrices){ rows.push(f[0], `${f[1]} – ${f[2]}`, `${f[3]} ${f[4]}`, `Price unavailable`, ``); }
    else rows.push(f[0], `${f[1]} – ${f[2]}`, `${f[3]} ${f[4]}`, `$${f[5]}`, ``, `Select`, ``);
  });
  const tail = [];
  for (let i=0;i<780;i++) tail.push(junkLine(i+5));
  return head.concat(rows, tail).join("\n");
}
/* deterministic stand-in for an extractor agent */
function stubExtract(slicedText, dateLabel){
  const lines = slicedText.split("\n");
  const out = [];
  for (let i=0;i<lines.length;i++){
    const price = /^\$\s?([\d,]+)$/.exec(lines[i].trim());
    if (!price) continue;
    const airline = lines[i-3], times = lines[i-2], dur = lines[i-1];
    if (!airline || !times || !dur) continue;
    if (!/\d/.test(times)) continue;
    out.push({ airline:airline.trim(), times:times.trim(),
               duration:((/^(\d+h(?:\s*\d+m)?)/.exec(dur.trim())||[])[1]||dur.trim()),
               stops: /nonstop/i.test(dur) ? "nonstop" : "1 stop",
               price: parseFloat(price[1].replace(/,/g,"")), strategy:dateLabel });
    if (out.length >= 3) break;
  }
  return out;
}

const PROMPTS = {
  parser:`Parse the user's flight request into structured fields.

The user message includes today's date. If the user gives a relative or incomplete date such as "next Tuesday" or "November 5", convert it into an absolute YYYY-MM-DD date using today's date as the reference. Leave omitted fields such as budget and cabin as null. Do not guess.

The date field is the user's preferred date when one is stated. For a date range, use the first day as date unless the user identifies a preferred day inside the range.

For date_is_flexible, judge the wording semantically rather than by simple keyword matching. Vague wording such as "around November 5", "early November", or an explicit range means true unless the user insists on an exact date. Wording such as "must be", "only", or "cannot change" means false.

When date_is_flexible is true, always fill date_window_start and date_window_end with the earliest and latest acceptable departure dates. Interpret "around DATE" as one day before through one day after, "early MONTH" as days 1 through 7, "mid MONTH" as days 10 through 20, and "late MONTH" as days 21 through the last day. For an explicit range, preserve its endpoints. When the date is exact, set both window fields to null.`,
  extractor: d=>`You are a flight-information extraction assistant for Kayak search results on ${d}.

The user message will contain raw fetched page text. The first line may begin with "[fetch diagnostic]",
"[fetch warning]", or "[browserbase_fetch error]". Read it first; it tells you whether this fetch succeeded.

If the fetch succeeded and flight data is present, extract up to 3 real candidate flights. For each one,
include airline, departure time, arrival time, duration, price, and whether it is nonstop or has stops.
Use a concise list format. The raw text was converted from a web page, so related fields may be spread across nearby lines; merge them using context.

If the fetch failed or no flight data is present, say clearly that the ${d} path did not return flight data and briefly explain why.

Never invent flight data. It is better to report that the fetch returned no usable data than to fabricate a plausible-looking option.`,
  ranker:`You are the merge/ranking agent.

You will see candidate flights from one or more parallel date searches, plus user preferences such as budget and cabin. Each strategy names the departure date it searched.

Merge and deduplicate the results. Rank up to 5 candidate flights by value, balancing price and duration while prioritizing user budget/cabin preferences. Label which strategy produced each flight.

If the conversation history contains critic feedback requesting looser criteria, rerank accordingly. For example, if the critic says to relax the budget to $X, include options that were previously excluded for exceeding the original budget.

If every search path failed or returned no real flight data, state that no usable candidate flights are available. Do not invent flight information.

Never drop a flight for being over the user's budget, and never say that no usable candidates are available when the results above list real flights. Whether the list meets the budget is the critic's call, not yours.

Output only the candidate list. Do not make the final budget-satisfaction judgment; that belongs to the critic agent.`,
  critic:`You are the critic agent. Your job is final quality control before candidate flights are shown to the user.

Inspect the merge/ranking agent's candidate list. Your reply must begin with exactly one of these three words, uppercase and at the start of the message:

- NO_DATA - The list is empty, or the content shows a fetch error or no real flight data. Do not request reranking when the source data is missing.
- RETRY - The user mentioned a budget, cabin, or other preference, but none of the candidates satisfy it, and you have not already said RETRY in this conversation. Explain which condition should be relaxed, such as "relax the budget to $X" or "allow one stop".
- APPROVED - The candidates satisfy the user's preferences, or they still do not fully satisfy them after one retry. In the latter case, approve and honestly explain that these are the closest options found.

If the user did not mention any budget or cabin preference, APPROVED is fine.

The first word must be NO_DATA, RETRY, or APPROVED. Do not add a prefix, Markdown decoration, or a friendly lead-in before that word.`,
  summarizer:`Create the final structured report from the merge/ranking agent's candidates and the critic's verdict, if any.

- If the critic said NO_DATA, or if the candidate list contains no real flights, set options to an empty list, set within_budget to false, and explain in notes that fetching failed or no real flight data was available. Do not invent flights.

  selector:`You are the dispatcher for a multi-agent workflow. Decide which role should speak next.

Available roles and responsibilities:
{roles}

Conversation history:
{history}

Decision rules:
- If the merge/ranking agent just produced candidate flights, decide whether critic review is needed:
  * If the user explicitly mentioned a budget, cabin requirement, or other concrete preference, choose budget_critic_agent so it can verify the candidates.
  * If the user gave no budget, cabin, or preference, choose summarizer_agent directly and do not waste an extra round.
- If the critic agent just spoke, follow its verdict: choose merge_ranker_agent when it requests reranking, and choose summarizer_agent when it approves or reports no data.

Choose the next speaker from {participants}. Return only the role name, with no extra text.`,
  roles:`merge_ranker_agent: Merge/ranking agent: deduplicate and rank candidate flights from parallel searches. It speaks first after search results, and handles reranking if the critic asks for it.
budget_critic_agent: Critic agent: checks whether candidates satisfy the user's budget/preferences and decides whether reranking is needed or the list can be finalized.
summarizer_agent: Summarizer agent: turns confirmed candidate flights into the final structured report. It is the last step of the workflow.`,

/* ---- the prompt inspector: one card per model call ---- */
function callCard(host, spec){
  /* spec: {n, role, mode, system, task, raw, parsed, usage, ms, note} */
  const card=el("div","callcard");
  const meta = `<span>stand-in reply</span><span>${spec.usage?("~"+(spec.usage.prompt+spec.usage.completion)+" tok est."):""}</span>`;
  card.innerHTML=`
    <div class="callhead"><span class="cn">${spec.n}. ${esc(spec.role)}${spec.note?` <i>· ${esc(spec.note)}</i>`:""}</span>
      <span class="cmeta">${meta}<span>▾</span></span></div>
    <div class="calltabs"></div><div class="callbody"></div>`;
  const rawText = spec.raw!=null ? spec.raw : spec.text;
  const parsedText = spec.parsed==null ? "" : (typeof spec.parsed==="string" ? spec.parsed : JSON.stringify(spec.parsed,null,2));
  const tabs=[["system","SYSTEM PROMPT",spec.system],["task","TASK SENT",spec.task],
              ["raw","RAW OUTPUT",rawText],["parsed","PARSED / VALIDATED",parsedText]]
              .filter(t=>t[2]!=null && t[2]!=="");
  const tb=card.querySelector(".calltabs"), bd=card.querySelector(".callbody");
  let cur=Math.max(0, tabs.findIndex(t=>t[0]==="raw"));
  const paint=()=>{ Array.from(tb.children).forEach((b,i)=>b.setAttribute("aria-pressed", i===cur?"true":"false"));
    bd.textContent = tabs[cur] ? tabs[cur][2] : ""; };
  tabs.forEach((t,i)=>{ const b=el("button",null,t[1]); b.onclick=()=>{ cur=i; paint(); }; tb.appendChild(b); });
  card.querySelector(".callhead").onclick=()=>card.classList.toggle("closed");
  card.classList.add("closed");
  paint();
  host.appendChild(card);
  return card;
}

async function modelCall(o){
  /* o: {role, system, task, schema, schemaName, maxTokens, stub, note} */
  const text = o.stub();
  return { mode:"stub", role:o.role, note:o.note, system:o.system, task:o.task, text,
           parsed:o.stubParsed ? o.stubParsed() : null,
           usage:{ prompt:FF.est(o.system+o.task), completion:FF.est(text) }, ms:0 };
}
function fmtFlights(list){
  return list.length
    ? list.map(f=>`- ${f.airline} ${f.times}, ${f.duration}, ${f.stops}, $${f.price}`).join("\n")
    : "This path did not return flight data.";
}
async function runPipeline2(cfg, log, onCall){
  const T={}, add=(k,n)=>{ T[k]=(T[k]||0)+n; };
  let nCall=0, routingTokens=0, routingCalls=0;
  const record=(r, bucket)=>{ nCall++; add(bucket, r.usage.prompt+r.usage.completion);
    onCall(Object.assign({n:nCall}, r)); return r; };

  /* ---------- Stage 1 · parse ---------- */
  log("st","[Stage 1] Parsing query...");
  const parseTask=`Today's date is ${cfg.today}. The user's flight request is: ${cfg.query}`;
  const guess={ departure_iata:"SFO", destination_iata:"JFK", date:cfg.date, return_date:null,
                budget_usd:cfg.budget, cabin:null, other_preferences:null, date_is_flexible:cfg.flexible,
                date_window_start: cfg.flexible ? (cfg.windowStart||null) : null,
                date_window_end:   cfg.flexible ? (cfg.windowEnd||null)   : null };
  const pr=record(await modelCall({ role:"query_parser_agent", note:"structured output → ParsedQuery",
    system:PROMPTS.parser, task:parseTask, schema:SCHEMAS.ParsedQuery, schemaName:"ParsedQuery", maxTokens:400,
    stub:()=>JSON.stringify(guess,null,2), stubParsed:()=>JSON.stringify(guess,null,2) }), "Stage 1 parse");
  let parsed = pr.mode==="live" ? pr.parsed : guess;
  if (!parsed || typeof parsed.date_is_flexible!=="boolean"){
    log("bad","Query parsing did not return a structured ParsedQuery, so the pipeline cannot continue.");
    log("dim","(this is the isinstance() guard in main_advanced.py — a readable stop, not a traceback)");
    return { failed:true, tokens:T, agentTotal:Object.values(T).reduce((a,b)=>a+b,0), routingTokens, routingCalls };
  }
  log("", JSON.stringify(parsed,null,2));
  if (pr.mode==="live"){
    const diff=[];
    if (parsed.date_is_flexible!==cfg.flexible) diff.push(`date_is_flexible: you guessed ${cfg.flexible}, the model returned ${parsed.date_is_flexible}`);
    if ((parsed.budget_usd??null)!==(cfg.budget??null)) diff.push(`budget_usd: you guessed ${cfg.budget}, the model returned ${parsed.budget_usd}`);
    if (parsed.date!==cfg.date) diff.push(`date: you guessed ${cfg.date}, the model returned ${parsed.date}`);
    log(diff.length?"acc":"dim", diff.length ? "the model's judgement differs from yours — "+diff.join("; ") : "the model agreed with the fields you supplied");
  }

  /* ---------- Stage 2 · fan-out ---------- */
  const dates = FF.planSearchDates(parsed.date, parsed.date_window_start, parsed.date_window_end, parsed.date_is_flexible, FF.MAX_SEARCH_DATES, cfg.today);
  log("st",`[Stage 2 · dynamic decision 1] date_is_flexible=${parsed.date_is_flexible}` +
      (parsed.date_is_flexible && parsed.date_window_start && parsed.date_window_end ? `, window ${parsed.date_window_start} → ${parsed.date_window_end}` : "") +
      ` → code planned ${dates.length} search path${dates.length>1?"s":""}: ${dates.join(", ")}`);
  if (parsed.date_is_flexible && dates.length===1) log("dim",`[note] Flexible-date planning produced one usable date: ${dates[0]}.`);

    const label = "Strategy " + String.fromCharCode(65+idx) + ": " + d + ", " + (d===parsed.date ? "preferred date" : "date-window sample");
    if (cfg.failFetch) return { d, label, page:`Search URL: ${FF.kayakSearchUrl("SFO","JFK",d)}\n\nPage content:\n[browserbase_fetch error] Fetch failed: TimeoutError('timeout')`, objs:[] };

  fetched.forEach(f=>{ if(f.diag) log("dim","[debug] "+f.label+" → "+f.diag.slice(0,110)+"…"); });

      stub:()=>fmtFlights(f.objs) }), "Stage 2 parallel search + extraction");
    parts.push(`[${f.label}]\n${r.text}`);

      const sr=await modelCall({ role:"SelectorGroupChat dispatcher", note:"produces no message — billed, invisible in the transcript",

      nCall++; onCall(Object.assign({n:nCall}, sr));
      routingTokens += sr.usage.prompt+sr.usage.completion;

      next = ballot.indexOf(pick)>=0 ? pick : ballot[ballot.length-1];

          return ranked.length ? ranked.map((f,i)=>`${i+1}. ${f.airline} $${f.price} ${f.stops} (${f.strategy})`).join("\n")+(ceiling!==null?`\n(reranked at the relaxed ceiling of $${ceiling})`:"")
            : "No usable candidate flights are available; every search path returned no real flight data."; } }), "Stage 3 orchestration agent messages");
      content=r.text;
    } else if (next==="budget_critic_agent"){
      const turns=messages.filter(m=>m.source==="budget_critic_agent").length+1;
      const r=record(await modelCall({ role:"budget_critic_agent", note:"first word is the routing signal",
        system:PROMPTS.critic, task:hist(), maxTokens:300,
        stub:()=>{ const min=allObjs.length?Math.min(...allObjs.map(f=>f.price)):null;
          if(!allObjs.length) return "NO_DATA — the candidate list is empty and the source text shows a fetch error. Reranking cannot help.";

      content=r.text;
      if (r.mode==="live" && FF.criticVerdict(content)==="RETRY") ceiling=ceiling??0;
    } else {
      const r=record(await modelCall({ role:"summarizer_agent", note:"structured output → FlightSearchReport",

    }

    log("key",`---------- ${next} ${by==="code"?"(routed by selector_func)":"(routed by the model)"} ----------`);

  }

  log("ok","Actual SelectorGroupChat path: "+path);
  log("ok",`Dynamic decision 2 result: model ${messages.some(m=>m.source==="budget_critic_agent")?"chose critic review":"skipped critic review and finalized directly"}`);
  log("dim","Stopped by: "+stop);
  if (report){
    /* _enforce_report_facts(): fields the code can compute are not left to the model. */
    const fixes=[];
    if (!(report.origin||"").includes(parsed.departure_iata)){ fixes.push(`origin: model wrote ${JSON.stringify(report.origin)}, code sets ${JSON.stringify(parsed.departure_iata)}`); report.origin=parsed.departure_iata; }

    if (report.date!==parsed.date){ fixes.push(`date: model wrote ${JSON.stringify(report.date)}, code sets the requested date ${JSON.stringify(parsed.date)}`); report.date=parsed.date; }

      else if (!parsed.date_is_flexible){ o.departure_date=parsed.date; fixes.push(`option departure_date: exact-date request lets code set ${parsed.date}`); } });
    if (!(report.options||[]).length && allObjs.length){ const c=Math.min(...allObjs.map(f=>f.price)); fixes.push(`notes: the report is empty, but the search found ${allObjs.length} priced flights (cheapest $${c}) - saying so`); report.notes=(report.notes+` Flights were found (cheapest $${c}) but none were returned as options.`).trim(); }

  const agentTotal=Object.values(T).reduce((a,b)=>a+b,0);
  return { tokens:T, agentTotal, routingTokens, routingCalls, realTotal:agentTotal+routingTokens,

}

function wLadder(host, done){
  const R = LADDER.rungs;
  const lines = t => String(t).replace(/\n$/,"").split("\n");
  const setOf = arr => { const m = Object.create(null); arr.forEach(l => { m[l.trim()] = 1; }); return m; };

  /* Highlight what is new since the previous step — but only when "new" is the
     minority. If almost every line changed, marking them all teaches nothing. */
  function block(text, prev, lang){
    const ls = lines(text), old = prev ? setOf(lines(prev)) : null;
    const isNew = ls.map(l => !!(old && l.trim() && !old[l.trim()]));
    const n = isNew.filter(Boolean).length;
    const useHi = old && n > 0 && n <= Math.max(1, Math.floor(ls.length * 0.6));
    const html = ls.map(function(l,i){
      const b = lang === "py" ? hiLine(l, "py") : esc(l);
      return useHi && isNew[i] ? '<span class="nw">' + b + '</span>' : b;
    }).join("\n");
    return { html: html, hi: useHi, allNew: !!(old && n === ls.filter(l=>l.trim()).length) };
  }

  host.innerHTML = '<div class="stage">' +
    '<div class="stage-bar"><span class="stage-title">One question, five harnesses</span>' +
      '<span class="stage-ctl"><button class="btn tiny" id="lrCmp">compare all five</button></span></div>' +
    '<div class="stage-body">' +
      '<div class="lr-q"><b>TASK</b> &nbsp;' + esc(LADDER.question) + '</div>' +
      '<div class="chips" id="lrTabs"></div>' +
      '<div class="lr-grid" id="lrGrid"></div>' +
      '<div id="lrBody"></div>' +
    '</div></div>';

  const tabs = host.querySelector("#lrTabs"), grid = host.querySelector("#lrGrid");
  const body = host.querySelector("#lrBody");
  let i = 0, ci = 0, cmp = false;

  function grids(){
    const row = (label, cells) => '<div class="h">' + label + '</div>' + cells.join("");
    const rk = R.map((r,j) => '<div class="c rk' + (j===i&&!cmp?" on":"") + '" data-j="'+j+'">' + r.rung + '</div>');
    const mc = R.map((r,j) => '<div class="c' + (j===i&&!cmp?" on":"") + '">' + r.modelCalls + '</div>');
    const cl = R.map((r,j) => '<div class="c' + (j===i&&!cmp?" on":"") + '">' + r.codeLines + '</div>');
    const ok = R.map((r,j) => '<div class="c ' + (r.complete?"yes":"no") + (j===i&&!cmp?" on":"") + '">' + (r.complete?"YES":"NO") + '</div>');
    const pt = R.map((r,j) => '<div class="c' + (j===i&&!cmp?" on":"") + '">' + (r.promptTokens||0) + '</div>');
    grid.innerHTML = row("", rk) + row("model calls", mc) + row("prompt tokens paid for", pt)
                   + row("lines you write", cl) + row("both questions answered", ok);
    Array.from(grid.querySelectorAll(".rk")).forEach(function(c){
      c.onclick = function(){ cmp = false; i = +c.dataset.j; ci = 0; paint(); if(done) done(); };
    });
  }

  function paintRung(){
    const r = R[i], prevCode = i > 0 ? R[i-1].code : null;
    const call = r.calls[ci], prevPrompt = ci > 0 ? r.calls[ci-1].prompt : null;
    const cb = block(r.code, prevCode, "py"), pb = block(call.prompt, prevPrompt, "txt");
    const cnote = !prevCode ? "the whole thing"
                : cb.hi ? "highlighted = new since " + R[i-1].rung
                : (cb.allNew ? "every line is new" : "rewritten since " + R[i-1].rung);
    body.innerHTML =
      '<div class="lr-two">' +
        '<div class="lr-box"><div class="lr-bh"><span>your code &middot; ' + r.rung + '</span>' +
          '<span>' + cnote + '</span></div>' +
          '<pre>' + cb.html + '</pre></div>' +
        '<div class="lr-box" id="lrEx"><div class="lr-bh"><span>what crossed the wire</span>' +
          '<div class="lr-step"><button class="btn tiny" id="lrPrev">&#9664;</button>' +
          '<b>call ' + (ci+1) + ' / ' + r.calls.length +
          (call.promptTokens ? '  &middot;  \u2248' + call.promptTokens + ' tok' : '') + '</b>' +
          '<button class="btn tiny" id="lrNext">&#9654;</button></div></div>' +
          '<div class="lr-rl">prompt sent' + (pb.hi ? ' &middot; highlighted = added since the previous call' : '') + '</div>' +
          '<pre>' + pb.html + '</pre>' +
          '<div class="lr-reply"><div class="lr-rl">what the model replied</div><pre>' + esc(call.reply) + '</pre></div></div>' +
      '</div>' +
      '<div class="lr-buys"><b>' + r.rung + ' buys you:</b> ' + esc(r.buys) + '</div>';
    const ex = body.querySelector("#lrEx");
    if (ci > 0){ ex.classList.add("lr-flash"); setTimeout(function(){ ex.classList.remove("lr-flash"); }, 950); }
    body.querySelector("#lrPrev").onclick = function(){ if(ci>0){ ci--; paintRung(); } };
    body.querySelector("#lrNext").onclick = function(){ if(ci<R[i].calls.length-1){ ci++; paintRung(); if(done) done(); } };
  }

  function paintCmp(){
    body.innerHTML = '<table class="lr-cmp"><thead><tr>' +
      '<th>rung</th><th>calls</th><th>code</th><th>both answered</th><th>the answer it produced</th>' +
      '</tr></thead><tbody>' +
      R.map(function(r){
        return '<tr class="' + (r.complete?"done":"") + '"><td class="k">' + r.rung + '</td>' +
          '<td>' + r.modelCalls + '</td><td>' + r.codeLines + ' ln</td>' +
          '<td style="color:var(--' + (r.complete?"pass":"warn") + ');font-weight:600">' + (r.complete?"YES":"NO") + '</td>' +
          '<td>' + esc(r.answer) + '</td></tr>';
      }).join("") + '</tbody></table>';
  }

  function paint(){
    Array.from(tabs.children).forEach(function(c,j){ c.className = "chip " + (j===i && !cmp ? "picked":""); });
    host.querySelector("#lrCmp").setAttribute("aria-pressed", cmp ? "true":"false");
    grids();
    if (cmp) paintCmp(); else paintRung();
  }

  R.forEach(function(r,j){
    const b = el("button","chip"); b.textContent = r.rung + " · " + r.title.split(" - ")[0];
    b.style.cursor = "pointer";
    b.onclick = function(){ cmp = false; i = j; ci = 0; paint(); if(done) done(); };
    tabs.appendChild(b);
  });
  host.querySelector("#lrCmp").onclick = function(){ cmp = !cmp; paint(); if(done) done(); };
  paint();
}
